# Stack para Docker Swarm + Traefik (Portainer) — mesmo padrão do Kairos.
# Imagem construída pelo GitHub Action e publicada no GHCR.
version: "3.8"

services:
  orcamento-bot:
    image: ghcr.io/nicholas1708/orcamento-bot:latest
    environment:
      PORT: "3000"

      # WAHA já existente no servidor (o mesmo do Kairos/AtendeNexo)
      WAHA_URL: "https://wh.atendenexo.com.br"
      WAHA_SESSION: "telhas"                 # sessão DEDICADA pra empresa de telhas
      WAHA_API_KEY: "DEFINIR_NO_PORTAINER"   # mesma chave configurada no WAHA

      # IA (OpenAI) — opcional: interpreta texto livre ("quero a de 40mm" → opção 2).
      # Vazio = só menus numerados, sem custo de tokens.
      OPENAI_API_KEY: "DEFINIR_NO_PORTAINER"
      OPENAI_MODEL: "gpt-4o-mini"

      # Fonte de preços: local (catalogo.json) | gestaoclick (quando contratar a API)
      PRICING_SOURCE: "local"
      GC_ACCESS_TOKEN: ""
      GC_SECRET_TOKEN: ""

      # Painel interno — obrigatório (protege /painel e os PDFs com dados de clientes)
      PAINEL_SENHA: "DEFINIR_NO_PORTAINER"

      # Dados da empresa (aparecem no PDF)
      EMPRESA_NOME: "DEFINIR_NO_PORTAINER"
      EMPRESA_TELEFONE: "DEFINIR_NO_PORTAINER"
      EMPRESA_CIDADE: "DEFINIR_NO_PORTAINER"
    # ⚠️ O container é DESCARTÁVEL: some e é recriado da imagem a cada deploy.
    # Tudo que a empresa cadastra tem que estar num volume, senão volta ao que
    # está no repositório e o cadastro se perde.
    volumes:
      - orcamento-dados:/app/dados         # ⚠️ catálogo em uso + vendedores — o cadastro
      - orcamento-fotos:/app/img           # ⚠️ fotos enviadas pelo painel
      - orcamento-sessions:/app/sessions   # fichas de conversa sobrevivem a redeploy
      - orcamento-pdfs:/app/out            # PDFs gerados
      - orcamento-imgs:/app/img-cache      # cache de fotos baixadas do CDN
      - orcamento-clientes:/app/clientes   # cadastro de clientes recorrentes
      - orcamento-hist:/app/orcamentos     # histórico exibido no painel
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.orcamento.rule=Host(`orcamento.atendenexo.com.br`)"
        - "traefik.http.routers.orcamento.entrypoints=websecure"
        - "traefik.http.routers.orcamento.tls=true"
        - "traefik.http.routers.orcamento.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.orcamento.loadbalancer.server.port=3000"
        - "traefik.docker.network=network_public"

networks:
  network_public:
    external: true

volumes:
  orcamento-dados:
  orcamento-fotos:
  orcamento-sessions:
  orcamento-pdfs:
  orcamento-imgs:
  orcamento-clientes:
  orcamento-hist:

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador — Bot de Orçamentos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b141a; display: flex; justify-content: center; min-height: 100vh; }
  .phone { width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 100vh; background: #0b141a; }
  header { background: #202c33; color: #e9edef; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header .info b { font-size: 15px; display: block; }
  header .info small { color: #8696a0; font-size: 12px; }
  header button { margin-left: auto; background: none; border: 1px solid #8696a0; color: #8696a0; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  header button:hover { color: #e9edef; border-color: #e9edef; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; color: #e9edef; }
  .bot { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
  .user { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
  .msg b { font-weight: 600; }
  .pdfcard { background: #202c33; align-self: flex-start; border-radius: 8px; padding: 12px; display: flex; gap: 10px; align-items: center; max-width: 82%; }
  .pdfcard .ico { font-size: 28px; }
  .pdfcard a { color: #53bdeb; font-size: 14px; text-decoration: none; font-weight: 600; }
  .pdfcard small { color: #8696a0; display: block; font-size: 12px; }
  .handoff { align-self: center; background: #182229; color: #ffd279; font-size: 12px; padding: 5px 12px; border-radius: 12px; }
  .typing { color: #8696a0; font-size: 13px; align-self: flex-start; padding: 4px 12px; }
  footer { display: flex; gap: 8px; padding: 10px 12px; background: #202c33; }
  footer input { flex: 1; background: #2a3942; border: none; border-radius: 20px; padding: 11px 16px; color: #e9edef; font-size: 14px; outline: none; }
  footer button { background: #00a884; border: none; border-radius: 50%; width: 44px; height: 44px; color: #fff; font-size: 18px; cursor: pointer; }
  footer button:hover { background: #06cf9c; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="avatar">🤖</div>
    <div class="info"><b>Bot de Orçamentos</b><small>simulador — mesmo fluxo do WhatsApp</small></div>
    <button onclick="resetar()">↺ Reiniciar</button>
  </header>
  <div id="chat"></div>
  <footer>
    <input id="input" placeholder="Digite uma mensagem" autocomplete="off"
           onkeydown="if(event.key==='Enter')enviar()">
    <button onclick="enviar()">➤</button>
  </footer>
</div>

<script>
  // cada aba/reinício = um "cliente" novo (chatId diferente => ficha nova em sessions/)
  let chatId = 'teste-' + Date.now();
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');

  // converte *negrito* e _itálico_ do WhatsApp pra HTML
  const wa = (t) => t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/_([^_\n]+)_/g, '<i>$1</i>');

  function add(html, cls) {
    const d = document.createElement('div');
    d.className = cls;
    d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function mandar(texto) {
    const typing = add('digitando…', 'typing');
    try {
      const r = await fetch('/simulate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatId, texto }),
      });
      const { acoes, error } = await r.json();
      typing.remove();
      if (error) { add('⚠️ Erro: ' + error, 'msg bot'); return; }
      for (const a of acoes || []) {
        if (a.type === 'text') add(wa(a.text), 'msg bot');
        if (a.type === 'image') add(
          `<img src="${a.url}" style="max-width:100%;border-radius:6px;display:block;margin-bottom:4px">` +
          `<small style="color:#8696a0">${wa(a.caption || '')}</small>`, 'msg bot');
        if (a.type === 'pdf') add(
          `<div class="ico">📄</div><div><a href="${a.url}" target="_blank">Abrir orçamento (PDF)</a><small>${wa(a.caption || '')}</small></div>`,
          'pdfcard');
        if (a.type === 'handoff') add('🧑‍💼 encaminhado ao vendedor — ' + a.motivo, 'handoff');
      }
    } catch (e) {
      typing.remove();
      add('⚠️ Servidor fora do ar? Rode <b>npm start</b> e recarregue.', 'msg bot');
    }
  }

  function enviar() {
    const t = input.value.trim();
    if (!t) return;
    add(wa(t), 'msg user');
    input.value = '';
    mandar(t);
  }

  function resetar() {
    chatId = 'teste-' + Date.now();
    chat.innerHTML = '';
    mandar('oi'); // dispara o início do fluxo com um cliente novo
  }

  resetar(); // inicia a conversa ao abrir
</script>
</body>
</html>

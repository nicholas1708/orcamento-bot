<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos — Painel 4A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/painel/ui.css">
</head>
<body></body>
<script src="/painel/ui.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   PRODUTOS — três listas, um cadastro cada:

     Telhas       o que é vendido por metro, cortado sob medida
     Acabamentos  cumeeira, frontal, lateral, interno e os parafusos
     Estrutura    terças e vigas

   Cada item precisa de dois grupos de informação:
     • comercial  → preço (ou faixas de preço) e código do ERP
     • técnica    → largura útil, vão, onde se aplica, consumo por m²

   É a parte técnica que faz o orçamento se calcular sozinho. Sem ela o
   produto existe mas nunca entra numa lista automática — por isso o
   aviso no topo aponta exatamente o que está faltando.
   ═══════════════════════════════════════════════════════════════════ */
let telhas=[],complementos=[],perfis=[],familias=[];
let aba='telhas', busca='';

const APLICA={cumeeira:'Cumeeira (topo do telhado)',frontal:'Frontal (beiral da frente)',
  lateral:'Lateral (bordas das águas)',interno:'Interno (acabamento por dentro)'};
const VENDA={unidade:'Por peça',metro:'Por metro corrido',barra:'Por barra fechada'};

montarShell('produtos','Produtos','Catálogo que alimenta os orçamentos',
  `<a class="btn g" href="/painel/dados">📥 Importar planilha</a>
   <button class="btn" id="btn-novo" onclick="novo()">+ Nova telha</button>`);

g('corpo').innerHTML=`
  <div id="diag"></div>
  <div class="abas" id="abas"></div>
  <div class="filtros">
    <div class="campo busca"><label>Buscar</label>
      <input id="f-busca" placeholder="nome ou código" oninput="busca=this.value;pintar()"></div>
  </div>
  <div id="conteudo"></div>`;

/* ── Carga ────────────────────────────────────────────────────────── */
async function carregar(){
  try{
    const r=await pegar('/api/painel/produtos');
    telhas=r.produtos||[];complementos=r.complementos||[];perfis=r.perfis||[];
    familias=r.familias||[];
    contador('produtos',telhas.length+complementos.length+perfis.length);
    pintarAbas();pintar();diagnostico();
  }catch(e){
    g('conteudo').innerHTML=`<div class="msg bad">${esc(e.message)}</div>`;
  }
}

/** O que está faltando ou desvinculado no cadastro. */
async function diagnostico(){
  let d;try{ d=await pegar('/api/painel/diagnostico'); }catch{ return; }
  const bloco=(cls,titulo,itens)=>!itens.length?'':
    `<div class="msg ${cls}"><b>${titulo} (${itens.length})</b>
      <ul>${itens.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  g('diag').innerHTML=
    bloco('bad','🚫 Impede ou distorce orçamento',d.problemas||[])+
    bloco('warn','⚠️ Vale conferir',d.alertas||[])+
    ((d.problemas||[]).length||(d.alertas||[]).length?'':
      `<div class="msg ok"><b>✅ Cadastro completo</b> — todos os produtos têm preço,
        medidas e vínculos. Nada bloqueia a geração de orçamentos.</div>`);
}

/* ── Abas ─────────────────────────────────────────────────────────── */
function pintarAbas(){
  const t=[['telhas','Telhas',telhas.length],
           ['complementos','Acabamentos e fixação',complementos.length],
           ['perfis','Estrutura',perfis.length]];
  g('abas').innerHTML=t.map(([id,nome,n])=>
    `<button class="${aba===id?'on':''}" onclick="aba='${id}';busca='';g('f-busca').value='';pintar()">
      ${nome}<span class="n">${n}</span></button>`).join('');
  g('btn-novo').textContent=aba==='telhas'?'+ Nova telha'
    :aba==='complementos'?'+ Novo acabamento':'+ Novo perfil';
}

const filtra=(lista)=>{
  const b=busca.trim().toLowerCase();
  if(!b)return lista;
  return lista.filter(x=>(String(x.nome||'')+' '+String(x.codigo||'')).toLowerCase().includes(b));
};
const foto=(x)=>x.imagem
  ?`<img class="thumb" src="${esc(x.imagem)}" loading="lazy" alt="">`
  :`<span class="thumb vaga">▤</span>`;

function pintar(){
  pintarAbas();
  if(aba==='telhas')return pintarTelhas();
  if(aba==='complementos')return pintarComplementos();
  pintarPerfis();
}

/* ── Lista: telhas ────────────────────────────────────────────────── */
function pintarTelhas(){
  const lista=filtra(telhas);
  g('conteudo').innerHTML=`
    <div class="tabela"><table>
      <thead><tr><th>Produto</th><th>Família</th><th>Preço por metro</th>
        <th>Corte</th><th>Dados técnicos</th><th>Situação</th><th></th></tr></thead>
      <tbody>${lista.map(p=>{
        const fx=p.faixas_preco?.length?p.faixas_preco:[{ate_m2:null,preco:p.preco}];
        return `<tr class="clicavel" onclick="editarTelha('${esc(p.id)}')">
          <td><div class="linhaprod">${foto(p)}
            <span><span class="prim">${esc(p.nome)}</span>
              <div class="sec">${p.codigo?esc(p.codigo):'sem código'}${
                p.atributos?.cor?' · '+esc(p.atributos.cor):''}</div></span></div></td>
          <td><span class="tag">${esc(p.familia||'—')}</span></td>
          <td>${fx.map(f=>`<div class="sec">${f.ate_m2?'até '+NUM(f.ate_m2,0)+' m²':'acima disso'}:
            <b style="color:var(--brand-dd)">R$ ${BRL(f.preco)}</b></div>`).join('')}</td>
          <td><div class="sec">sob medida, de ${p.comprimento_minimo_m?NUM(p.comprimento_minimo_m,2):'—'} m</div>
            <div class="sec">até ${p.comprimento_maximo_m?NUM(p.comprimento_maximo_m,2):'—'} m</div></td>
          <td><div class="sec">largura útil ${p.largura_util_m?NUM(p.largura_util_m,3)+' m':'—'}</div>
            <div class="sec">vão ${p.vao_maximo_m||'—'} m · promo até ${p.promocao_ate_m||'—'} m</div></td>
          <td>${p.ativo===false?'<span class="tag off">inativo</span>':'<span class="tag ok">ativo</span>'}</td>
          <td class="acao" onclick="event.stopPropagation()">
            <button class="btn g sm" onclick="editarTelha('${esc(p.id)}')">Abrir</button>
            <button class="btn r sm" onclick="excluir('produto','${esc(p.id)}','${esc(p.nome).replace(/'/g,'')}')">Excluir</button></td>
        </tr>`;}).join('')}</tbody>
    </table>
    ${lista.length?'':`<div class="vazio"><b>${busca?'Nada encontrado':'Nenhuma telha cadastrada'}</b>
      ${busca?'Tente outro nome ou código.':'Sem telha cadastrada o orçamento não funciona.'}</div>`}
    </div>`;
}

/* ── Lista: complementos ──────────────────────────────────────────── */
/**
 * Em quais telhas este acabamento está marcado.
 * Zero = ele existe no cadastro mas não entra em orçamento nenhum. É o furo
 * que aparece quando alguém cadastra a peça e esquece de ligar na telha.
 */
function telhasQueUsam(itemId, quais){
  return telhas.filter(t=>{
    const v=t.compativeis&&t.compativeis[quais];
    return Array.isArray(v) ? v.indexOf(itemId)>=0 : true;   // sem vínculo = aceita tudo
  });
}

/** Coluna "Vai em": em quantas telhas a peça está marcada. */
function usadoEm(itemId, quais){
  const u=telhasQueUsam(itemId, quais);
  if(!u.length)return '<span class="tag bad">nenhuma telha</span>';
  // o nome da telha é longo; o que diferencia está depois do travessão (a cor)
  const curtos=u.map(t=>String(t.nome).split('—').pop().trim());
  return `<span class="tag info">${u.length} telha(s)</span>`
    +`<div class="sec">${esc(curtos.join(' · '))}</div>`;
}

function pintarComplementos(){
  const lista=filtra(complementos);
  const orfaos=complementos.filter(c=>c.ativo!==false&&!telhasQueUsam(c.id,'complementos').length);
  g('conteudo').innerHTML=`
    ${orfaos.length?`<div class="msg warn" style="margin-bottom:16px">
      <b>${orfaos.length} acabamento(s) fora de qualquer telha:</b>
      ${esc(orfaos.map(c=>c.nome).join(' · '))}.<br>
      Eles não vão aparecer em orçamento nenhum. Abra a telha em
      <a href="#" onclick="aba='telhas';pintar();return false">Telhas</a> e marque onde cada um entra.
    </div>`:''}
    <div class="tabela"><table>
      <thead><tr><th>Produto</th><th>Tipo</th><th>Como é vendido</th>
        <th>Preço</th><th>Vínculo do cálculo</th><th>Vai em</th><th>Situação</th><th></th></tr></thead>
      <tbody>${lista.map(c=>{
        const vinculo=c.tipo==='fixacao'
          ?(c.consumo_por_m2>0?`<span class="tag ok">${NUM(c.consumo_por_m2,2)} por m²</span>`
            :'<span class="tag bad">sem consumo por m²</span>')
          :(c.aplica_em?`<span class="tag ok">${esc(APLICA[c.aplica_em]||c.aplica_em)}</span>`
            :'<span class="tag bad">sem onde se aplica</span>');
        return `<tr class="clicavel" onclick="editarComplemento('${esc(c.id)}')">
          <td><div class="linhaprod">${foto(c)}
            <span><span class="prim">${esc(c.nome)}</span>
              <div class="sec">${c.codigo?esc(c.codigo):'sem código'}</div></span></div></td>
          <td><span class="tag ${c.tipo==='fixacao'?'info':'brand'}">${c.tipo==='fixacao'?'Fixação':'Acabamento'}</span></td>
          <td><div class="sec">${esc(VENDA[c.venda_por]||c.venda_por||'por peça')}</div>
            ${c.venda_por==='barra'?`<div class="sec">barra de ${NUM(c.comprimento_barra_m,2)} m</div>`:''}
            ${c.rendimento_m?`<div class="sec">rende ${NUM(c.rendimento_m,2)} m por peça</div>`:''}</td>
          <td class="num"><span class="prim">R$ ${BRL(c.preco)}</span>
            <div class="sec">${esc(c.unidade||'UN')}</div></td>
          <td>${vinculo}</td>
          <td>${usadoEm(c.id,'complementos')}</td>
          <td>${c.ativo===false?'<span class="tag off">inativo</span>':'<span class="tag ok">ativo</span>'}</td>
          <td class="acao" onclick="event.stopPropagation()">
            <button class="btn g sm" onclick="editarComplemento('${esc(c.id)}')">Abrir</button>
            <button class="btn r sm" onclick="excluir('complemento','${esc(c.id)}','${esc(c.nome).replace(/'/g,'')}')">Excluir</button></td>
        </tr>`;}).join('')}</tbody>
    </table>
    ${lista.length?'':`<div class="vazio"><b>${busca?'Nada encontrado':'Nenhum acabamento cadastrado'}</b>
      Cumeeira, frontal, lateral, interno e os parafusos entram aqui.</div>`}
    </div>`;
}

/* ── Lista: estrutura ─────────────────────────────────────────────── */
function pintarPerfis(){
  const lista=filtra(perfis);
  g('conteudo').innerHTML=`
    <div class="tabela"><table>
      <thead><tr><th>Perfil</th><th>Tipo</th><th class="num">Preço por metro</th>
        <th class="num">Vão máximo</th><th class="num">Barra</th><th>Situação</th><th></th></tr></thead>
      <tbody>${lista.map(p=>`<tr class="clicavel" onclick="editarPerfil('${esc(p.id)}')">
          <td><span class="prim">${esc(p.nome)}</span>
            <div class="sec">${p.codigo?esc(p.codigo):'sem código'}${
              p.peso_kg_m?' · '+NUM(p.peso_kg_m,2)+' kg/m':''}</div></td>
          <td><span class="tag brand">${p.tipo==='viga'?'Viga':'Terça'}</span></td>
          <td class="num"><span class="prim">R$ ${BRL(p.preco)}</span></td>
          <td class="num">${NUM(p.vao_maximo_m,2)} m</td>
          <td class="num">${NUM(p.barra_m||6,2)} m</td>
          <td>${p._confirmar?'<span class="tag warn">provisório</span>'
            :p.ativo===false?'<span class="tag off">inativo</span>':'<span class="tag ok">ativo</span>'}</td>
          <td class="acao" onclick="event.stopPropagation()">
            <button class="btn g sm" onclick="editarPerfil('${esc(p.id)}')">Abrir</button>
            <button class="btn r sm" onclick="excluir('perfil','${esc(p.id)}','${esc(p.nome).replace(/'/g,'')}')">Excluir</button></td>
        </tr>`).join('')}</tbody>
    </table>
    ${lista.length?'':`<div class="vazio"><b>${busca?'Nada encontrado':'Nenhum perfil cadastrado'}</b>
      Sem perfil, a opção de estrutura não aparece no orçamento.</div>`}
    </div>`;
}

/* ═══════════════ FORMULÁRIO: TELHA ═══════════════ */
let faixas=[];

function novo(){
  if(aba==='complementos')return editarComplemento(null);
  if(aba==='perfis')return editarPerfil(null);
  editarTelha(null);
}

function editarTelha(id){
  const p=id?telhas.find(x=>x.id===id):null;
  faixas=(p?.faixas_preco?.length?p.faixas_preco:p?[{ate_m2:null,preco:p.preco}]
    :[{ate_m2:50,preco:''},{ate_m2:100,preco:''},{ate_m2:200,preco:''},{ate_m2:null,preco:''}])
    .map(f=>({ate_m2:f.ate_m2??'',preco:f.preco??''}));

  abrirGaveta(
    `<h2>${p?esc(p.nome):'Nova telha'}</h2>
     <div style="font-size:13px;color:var(--muted)">${p?(p.codigo?'Código '+esc(p.codigo):'sem código do ERP')
       :'Vendida por metro, cortada sob medida'}</div>`,
    `<div id="pr-msg" class="msg" hidden></div>
     <input type="hidden" id="pr-id" value="${esc(id||'')}">

     ${p?'':`<div class="card" style="background:var(--brand-tint);border-color:var(--brand)">
       <h2>⚡ Atalho: cole a descrição do ERP</h2>
       <p class="d">Cole o nome completo como vem do GestãoClick. Eu separo o que
         der e preencho os campos — depois é só conferir.</p>
       <div class="campo"><textarea id="pr-desc" placeholder="358769 - CONFORT PIR 30mm TRAPÉZIO 40/1000 ZCL 0,43mm GALVALUME Superior - FORRO RAL 9003 BRANCO SLIM Inferior"></textarea></div>
       <button class="btn sm" style="margin-top:10px" onclick="desmembrar()">Separar informações</button>
       <div id="pr-achou" class="msg info" style="margin-top:12px" hidden></div>
     </div>`}

     <div class="card">
       <h2>Identificação</h2>
       <div class="grade">
         <div class="campo"><label>Código no ERP</label>
           <input id="pr-codigo" value="${esc(p?.codigo||'')}" placeholder="358769">
           <small>liga o produto ao GestãoClick e às unidades</small></div>
         <div class="campo"><label>Nome exibido <i>*</i></label>
           <input id="pr-nome" value="${esc(p?.nome||'')}" placeholder="Confort PIR 30mm Trapézio 40/1000">
           <small>é o que o cliente lê no orçamento</small></div>
         <div class="campo"><label>Família <i>*</i></label>
           <input id="pr-familia" list="fams" value="${esc(p?.familia||'')}" placeholder="Telha Termoisolante PIR">
           <datalist id="fams">${familias.map(f=>`<option value="${esc(f)}">`).join('')}</datalist>
           <small>agrupa as opções na tela do cliente</small></div>
         <div class="campo"><label>Cor / acabamento</label>
           <input id="pr-cor" value="${esc(p?.atributos?.cor||'')}" placeholder="Galvalume / Branco"></div>
       </div>
     </div>

     <div class="card">
       <h2>Preço por metro</h2>
       <p class="d">A fábrica cobra menos por metro conforme o volume sobe. Deixe a
         última faixa <b>sem limite</b> — ela vale para tudo acima.</p>
       <div id="pr-faixas"></div>
       <button class="btn g sm" style="margin-top:10px" onclick="addFaixa()">+ Adicionar faixa</button>
     </div>

     <div class="card">
       <h2>Dados técnicos</h2>
       <p class="d">É com isso que o sistema calcula quantas peças o telhado precisa.
         Sem largura útil, o cálculo automático nem roda.</p>
       <div class="grade g4">
         <div class="campo"><label>Largura útil (m) <i>*</i></label>
           <input id="pr-lu" value="${p?.largura_util_m??''}" placeholder="1,00">
           <small>o que cobre depois do encaixe</small></div>
         <div class="campo"><label>Largura total (m)</label>
           <input id="pr-lt" value="${p?.largura_total_m??''}" placeholder="1,05"></div>
         <div class="campo"><label>Comprimento máximo (m) <i>*</i></label>
           <input id="pr-cmax" value="${p?.comprimento_maximo_m??''}" placeholder="12">
           <small>maior peça que a fábrica corta</small></div>
         <div class="campo"><label>Comprimento mínimo (m)</label>
           <input id="pr-cmin" value="${p?.comprimento_minimo_m??''}" placeholder="0,50"></div>
         <div class="campo"><label>Transpasse na emenda (m)</label>
           <input id="pr-transp" value="${p?.transpasse_m??''}" placeholder="0,20">
           <small>sobreposição entre duas peças</small></div>
         <div class="campo"><label>Vão máximo entre terças (m)</label>
           <input id="pr-vao" value="${p?.vao_maximo_m??''}" placeholder="1,80"></div>
         <div class="campo"><label>Inclinação mínima (%)</label>
           <input id="pr-incl" value="${p?.inclinacao_minima_pct??''}" placeholder="10"></div>
         <div class="campo"><label>Promoção até (m)</label>
           <input id="pr-promo" value="${p?.promocao_ate_m??''}" placeholder="8">
           <small>peça maior que isso vai ao comercial</small></div>
       </div>
     </div>

     <div class="card">
       <h2>O que acompanha esta telha</h2>
       <p class="d">Marque os acabamentos e perfis que servem <b>nesta</b> telha.
         É essa lista que o cliente vê no orçamento e é dela que sai a quantidade —
         cumeeira galvalume não pode ser oferecida numa telha branca.</p>
       ${telhasParaCopiar(id)}
       <div id="pr-vinc-aviso" class="msg" hidden style="margin-bottom:14px"></div>
       ${caixinhas('pr-comp', complementos, p?(p.compativeis?.complementos??null):undefined,
                   'Nenhum acabamento cadastrado ainda — cadastre na aba Acabamentos primeiro.',
                   'buscar acabamento: cumeeira, frontal, lateral, parafuso…')}
       <h2 style="margin-top:18px">Estrutura compatível</h2>
       ${caixinhas('pr-perf', perfis, p?(p.compativeis?.perfis??null):undefined,
                   'Nenhum perfil cadastrado ainda.',
                   'buscar perfil: terça, viga…')}
     </div>

     <div class="card">
       <h2>Extras</h2>
       <div class="grade">
         <div class="campo"><label>Já vem com forro / isolamento?</label>
           <select id="pr-forro"><option value="nao">Não</option>
             <option value="sim" ${p?.forro_integrado?'selected':''}>Sim</option></select></div>
         <div class="campo"><label>Produto ativo?</label>
           <select id="pr-ativo"><option value="sim">Sim</option>
             <option value="nao" ${p?.ativo===false?'selected':''}>Não</option></select>
           <small>inativo não aparece para o cliente</small></div>
         ${campoFoto('pr-img',p?.imagem,'aparece nas duas telas de orçamento e no PDF')}
         <div class="campo"><label>Observação interna</label>
           <input id="pr-obs" value="${esc(p?.observacao||'')}" placeholder="não aparece para o cliente"></div>
       </div>
       ${p?'':`<div class="campo" style="margin-top:14px"><label>Descrição completa do ERP</label>
         <textarea id="pr-desccompleta" placeholder="opcional — guarda o nome original"></textarea></div>`}
     </div>

     <div style="display:flex;gap:9px;position:sticky;bottom:0;background:var(--bg-soft);padding:14px 0">
       <button class="btn" onclick="salvarTelha()">${p?'Salvar alterações':'Cadastrar telha'}</button>
       <button class="btn g" onclick="fecharGaveta()">Cancelar</button>
     </div>`
  );
  pintarFaixas();
  conferirVinculo();          // telha nova já abre avisando que falta escolher
}

/**
 * Lista de caixinhas de vínculo.
 *
 * ⚠️ TELHA NOVA NASCE COM NADA MARCADO — de propósito.
 * Antes ela nascia com tudo marcado, o que virava "aceita tudo" e devolvia
 * o defeito antigo: telha branca saindo com cumeeira galvalume, sem ninguém
 * perceber. Melhor a telha nova avisar que falta escolher do que sair errada.
 *
 * @param marcados  array de ids  → marca exatamente esses
 *                  null          → telha antiga, sem vínculo: marca tudo
 *                  undefined     → telha NOVA: não marca nada
 */
function caixinhas(pref, itens, marcados, vazio, dica){
  const lista=(itens||[]).filter(x=>x.ativo!==false);
  if(!lista.length)return `<p class="d">${vazio}</p>`;
  const marcado=(id)=>Array.isArray(marcados) ? marcados.indexOf(id)>=0 : marcados===null;
  const rotulo=(x)=>[x.codigo,APLICA[x.aplica_em]||x.aplica_em,x.tipo].filter(Boolean).join(' · ');

  return `
    <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
      <div class="campo busca" style="flex:1;min-width:200px;margin:0">
        <input id="${pref}-busca" placeholder="${esc(dica||'buscar…')}"
          oninput="filtrarCaixinhas('${pref}')"></div>
      <button type="button" class="btn g sm" onclick="marcarTodas('${pref}',true)">Marcar</button>
      <button type="button" class="btn g sm" onclick="marcarTodas('${pref}',false)">Desmarcar</button>
    </div>
    <div id="${pref}-cont" class="sec" style="margin-bottom:8px"></div>
    <div id="${pref}-grade" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">
    ${lista.map(x=>`<label class="${pref}-cx"
        data-busca="${esc(semAcento((x.nome||'')+' '+rotulo(x)))}"
        style="display:flex;gap:9px;align-items:flex-start;
        border:1px solid var(--line);padding:10px;cursor:pointer">
      <input type="checkbox" class="${pref}-chk" value="${esc(x.id)}"
        onchange="conferirVinculo()" ${marcado(x.id)?'checked':''} style="margin-top:2px">
      <span><b style="font-size:13px">${esc(x.nome)}</b>
        <small style="display:block;color:var(--muted)">${esc(rotulo(x)||'—')}</small></span>
    </label>`).join('')}
    </div>
    <div class="vazio" id="${pref}-nada" hidden style="padding:22px">
      Nenhum item com esse nome.
    </div>`;
}

const semAcento=(s)=>String(s||'').toLowerCase()
  .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'),'');

/**
 * Busca dentro da lista de vínculo.
 *
 * ⚠️ Esconde, não redesenha. Redesenhar perderia o que já está marcado nos
 * itens que saíram da tela — e `marcadas()` lê TODAS as caixinhas, inclusive
 * as escondidas. Buscar nunca desmarca nada.
 */
function filtrarCaixinhas(pref){
  const termo=semAcento(g(pref+'-busca')?.value);
  let visiveis=0;
  document.querySelectorAll('.'+pref+'-cx').forEach(el=>{
    const bate=!termo||el.dataset.busca.includes(termo);
    el.style.display=bate?'':'none';
    if(bate)visiveis++;
  });
  const nada=g(pref+'-nada');
  if(nada)nada.hidden=visiveis>0;
  contarCaixinhas(pref);
}

/** "3 de 20 marcados" — com a busca ativa, dá o retrato do todo, não do filtro. */
function contarCaixinhas(pref){
  const el=g(pref+'-cont');
  if(!el)return;
  const todas=document.querySelectorAll('.'+pref+'-chk').length;
  const on=document.querySelectorAll('.'+pref+'-chk:checked').length;
  const filtrando=!!g(pref+'-busca')?.value.trim();
  el.innerHTML=`<b>${on}</b> de ${todas} marcados`
    +(filtrando?' · a busca só esconde, não desmarca':'');
}

/**
 * Atalho da segunda telha em diante: puxa o vínculo de uma já cadastrada.
 * Telha nova quase sempre repete tudo da irmã e muda só a cumeeira.
 */
function telhasParaCopiar(idAtual){
  const outras=telhas.filter(t=>t.id!==idAtual);
  if(!outras.length)return '';
  return `<div class="campo" style="max-width:420px;margin-bottom:14px">
    <label>Copiar de outra telha</label>
    <select onchange="if(this.value)copiarVinculo(this.value);this.value=''">
      <option value="">— escolha uma telha já cadastrada —</option>
      ${outras.map(t=>`<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join('')}
    </select>
    <small>traz as marcações dela e você ajusta só a diferença</small>
  </div>`;
}

/**
 * Marca/desmarca só o que está VISÍVEL.
 * Com a busca ativa isso é o esperado: procuro "cumeeira", clico Marcar, e
 * marco as cumeeiras — sem varrer o resto da lista junto.
 */
function marcarTodas(pref,ligar){
  document.querySelectorAll('.'+pref+'-cx').forEach(el=>{
    if(el.style.display==='none')return;
    const chk=el.querySelector('.'+pref+'-chk');
    if(chk)chk.checked=ligar;
  });
  conferirVinculo();
}

/**
 * Ids marcados — sempre a lista de verdade.
 *
 * Não devolve mais null quando está tudo marcado. Guardar a lista explícita
 * é o que faz o vínculo continuar valendo depois: se amanhã você cadastrar
 * uma cumeeira de outra cor, ela NÃO entra sozinha nas telhas antigas.
 */
function marcadas(pref){
  const els=[...document.querySelectorAll('.'+pref+'-chk')];
  if(!els.length)return null;
  return els.filter(e=>e.checked).map(e=>e.value);
}

/** Aviso ao vivo: telha sem acabamento marcado sai pelada no orçamento. */
function conferirVinculo(){
  contarCaixinhas('pr-comp');
  contarCaixinhas('pr-perf');
  const el=g('pr-vinc-aviso');
  if(!el)return;
  const n=document.querySelectorAll('.pr-comp-chk:checked').length;
  if(n)return aviso('pr-vinc-aviso','',null);
  aviso('pr-vinc-aviso','warn',
    'Nenhum acabamento marcado: esta telha vai sair no orçamento <b>sem cumeeira, '
    +'sem frontal, sem lateral e sem parafuso</b>. Marque o que acompanha ela.');
}

/** Copia o vínculo de uma telha já cadastrada — atalho da segunda telha em diante. */
function copiarVinculo(id){
  const t=telhas.find(x=>x.id===id);
  if(!t)return;
  const põe=(pref,ids)=>document.querySelectorAll('.'+pref+'-chk').forEach(e=>{
    // telha sem vínculo (cadastro antigo) valia por "tudo"
    e.checked=Array.isArray(ids)?ids.indexOf(e.value)>=0:true;
  });
  põe('pr-comp',t.compativeis?.complementos);
  põe('pr-perf',t.compativeis?.perfis);
  conferirVinculo();
  aviso('pr-vinc-aviso','info',
    `Copiado de <b>${esc(t.nome)}</b>. Ajuste o que for diferente — a cumeeira quase sempre é.`);
}

function pintarFaixas(){
  g('pr-faixas').innerHTML=faixas.map((f,i)=>`
    <div style="display:grid;grid-template-columns:1fr 1fr 40px;gap:10px;align-items:end;margin-bottom:9px">
      <div class="campo"><label>${i===0?'Até quantos m²':''}</label>
        <input value="${f.ate_m2??''}" oninput="faixas[${i}].ate_m2=this.value"
          placeholder="${i===faixas.length-1?'em branco = daí pra cima':'50'}"></div>
      <div class="campo"><label>${i===0?'Preço por metro (R$)':''}</label>
        <input value="${f.preco??''}" oninput="faixas[${i}].preco=this.value" placeholder="129,50"></div>
      <button class="btn r sm" style="height:42px" ${faixas.length===1?'disabled':''}
        onclick="faixas.splice(${i},1);pintarFaixas()">✕</button>
    </div>`).join('');
}
function addFaixa(){faixas.push({ate_m2:'',preco:''});pintarFaixas();}

async function desmembrar(){
  const d=g('pr-desc')?.value?.trim();
  if(!d)return;
  let r;try{ r=await enviar('/api/painel/desmembrar',{descricao:d}); }catch{ return; }
  const põe=(id,v)=>{ if(v&&g(id))g(id).value=v; };
  põe('pr-codigo',r.codigo);
  põe('pr-nome',r.nome_curto);
  põe('pr-lu',r.largura_util_m);
  põe('pr-cor',[r.face_superior,r.face_inferior].filter(Boolean).join(' / '));
  if(r.tipo==='telha'&&r.nucleo)põe('pr-familia','Telha Termoisolante '+r.nucleo);
  if(r.nucleo&&g('pr-forro'))g('pr-forro').value='sim';
  if(g('pr-desccompleta'))g('pr-desccompleta').value=d;
  aviso('pr-achou','info',(r.confianca||[]).length
    ?`Identifiquei: <b>${esc((r.confianca||[]).join(', '))}</b>. Confira os campos e complete o que faltar.`
    :'Não consegui identificar automaticamente — preencha os campos na mão.');
}

async function salvarTelha(){
  const v=(id)=>g(id)?.value?.trim()||'';
  const fx=faixas.map(f=>({ate_m2:String(f.ate_m2).trim()===''?null:dec(f.ate_m2),preco:dec(f.preco)}))
    .filter(f=>f.preco>0);

  if(!v('pr-nome'))return aviso('pr-msg','bad','Informe o nome do produto.');
  if(!dec(v('pr-lu')))return aviso('pr-msg','bad','Largura útil é obrigatória — sem ela não dá para calcular a quantidade de peças.');
  if(!dec(v('pr-cmax')))return aviso('pr-msg','bad','Informe o comprimento máximo de fabricação.');
  if(!fx.length)return aviso('pr-msg','bad','Informe ao menos um preço.');

  // deixa passar, mas não deixa acontecer sem querer
  const semAcab=document.querySelectorAll('.pr-comp-chk').length
    && !document.querySelectorAll('.pr-comp-chk:checked').length;
  if(semAcab && !confirm(
    'Nenhum acabamento marcado para esta telha.\n\n'
    +'Ela vai sair no orçamento só com as telhas — sem cumeeira, sem frontal, '
    +'sem lateral e sem parafuso.\n\nSalvar assim mesmo?'))return;

  const corpo={
    id:v('pr-id')||null, codigo:v('pr-codigo')||null, nome:v('pr-nome'),
    familia:v('pr-familia')||'Outros',
    atributos:v('pr-cor')?{cor:v('pr-cor')}:{},
    descricao_completa:v('pr-desccompleta')||null,
    faixas_preco:fx,
    largura_util_m:dec(v('pr-lu')), largura_total_m:dec(v('pr-lt')),
    comprimento_maximo_m:dec(v('pr-cmax')), comprimento_minimo_m:dec(v('pr-cmin')),
    transpasse_m:dec(v('pr-transp')), vao_maximo_m:dec(v('pr-vao')),
    inclinacao_minima_pct:dec(v('pr-incl')), promocao_ate_m:dec(v('pr-promo')),
    compativeis:{complementos:marcadas('pr-comp'), perfis:marcadas('pr-perf')},
    forro_integrado:g('pr-forro').value==='sim',
    ativo:g('pr-ativo').value==='sim',
    imagem:v('pr-img')||null, observacao:v('pr-obs')||null,
  };
  try{
    await enviar('/api/painel/produto',corpo);
    fecharGaveta();await carregar();
  }catch(e){ aviso('pr-msg','bad',esc(e.message)); }
}

/* ═══════════════ FORMULÁRIO: COMPLEMENTO ═══════════════ */
function editarComplemento(id){
  const c=id?complementos.find(x=>x.id===id):null;
  const tipo=c?.tipo||'acabamento';

  abrirGaveta(
    `<h2>${c?esc(c.nome):'Novo acabamento'}</h2>
     <div style="font-size:13px;color:var(--muted)">${c?(c.codigo?'Código '+esc(c.codigo):'sem código do ERP')
       :'Cumeeira, frontal, lateral, interno ou parafuso'}</div>`,
    `<div id="cp-msg" class="msg" hidden></div>
     <input type="hidden" id="cp-id" value="${esc(id||'')}">

     <div class="card">
       <h2>Identificação</h2>
       <div class="grade">
         <div class="campo"><label>Código no ERP</label>
           <input id="cp-codigo" value="${esc(c?.codigo||'')}" placeholder="148384"></div>
         <div class="campo"><label>Nome exibido <i>*</i></label>
           <input id="cp-nome" value="${esc(c?.nome||'')}" placeholder="Cumeeira Galvalume 0,43mm"></div>

             <option value="acabamento" ${tipo==='acabamento'?'selected':''}>Acabamento (peça de fechamento)</option>

           </select></div>
         ${campoFoto('cp-img',c?.imagem,'aparece na escolha do cliente e no PDF')}
       </div>
     </div>

     <div class="card">
       <h2>Vínculo do cálculo</h2>
       <p class="d">É isso que faz a quantidade sair sozinha no orçamento.
         Sem esse vínculo o item nunca entra numa lista automática.</p>

       <div id="cp-bloco-acab" class="campo" style="margin-bottom:14px">
         <label>Onde se aplica <i>*</i></label>
         <select id="cp-aplica">
           <option value="">— escolha —</option>
           ${Object.entries(APLICA).map(([k,v])=>
             `<option value="${k}" ${c?.aplica_em===k?'selected':''}>${v}</option>`).join('')}
         </select>
         <small>frontal = comprimento × nº de águas · lateral = comprimento da telha × 2 × águas ·
           cumeeira = comprimento (só em 2 águas)</small>
       </div>

       <div id="cp-bloco-fix" class="campo">
         <label>Consumo por m² <i>*</i></label>
         <input id="cp-consumo" value="${c?.consumo_por_m2??''}" placeholder="3">
         <small>quantas peças por metro de telha (ex: 3 parafusos por m²)</small>
       </div>
     </div>

     <div class="card">
       <h2>Preço e venda</h2>
       <div class="grade g4">
         <div class="campo"><label>Como é vendido <i>*</i></label>
           <select id="cp-venda" onchange="trocarVendaComp()">
             ${Object.entries(VENDA).map(([k,v])=>
               `<option value="${k}" ${(c?.venda_por||'unidade')===k?'selected':''}>${v}</option>`).join('')}
           </select></div>
         <div class="campo"><label>Preço (R$) <i>*</i></label>
           <input id="cp-preco" value="${c?.preco??''}" placeholder="27,48">
           <small>pela unidade de venda escolhida</small></div>
         <div class="campo" id="cp-bloco-barra"><label>Tamanho da barra (m)</label>
           <input id="cp-barra" value="${c?.comprimento_barra_m??''}" placeholder="3">
           <small>o sistema arredonda para barras inteiras</small></div>
         <div class="campo"><label>Rendimento por metro</label>
           <input id="cp-rend" value="${c?.rendimento_m??''}" placeholder="1">
           <small>quantos metros uma peça cobre</small></div>
         <div class="campo"><label>Unidade no PDF</label>
           <input id="cp-unidade" value="${esc(c?.unidade||'')}" placeholder="UN, PC ou M"></div>
         <div class="campo"><label>Ativo?</label>
           <select id="cp-ativo"><option value="sim">Sim</option>
             <option value="nao" ${c?.ativo===false?'selected':''}>Não</option></select></div>
       </div>
       <div class="campo" style="margin-top:14px"><label>Observação interna</label>
         <input id="cp-obs" value="${esc(c?.observacao||'')}"></div>
     </div>

     <div style="display:flex;gap:9px;position:sticky;bottom:0;background:var(--bg-soft);padding:14px 0">
       <button class="btn" onclick="salvarComplemento()">${c?'Salvar alterações':'Cadastrar'}</button>
       <button class="btn g" onclick="fecharGaveta()">Cancelar</button>
     </div>`
  );
  trocarTipoComp();trocarVendaComp();
}

function trocarTipoComp(){
  const fix=g('cp-tipo').value==='fixacao';
  g('cp-bloco-acab').style.display=fix?'none':'';
  g('cp-bloco-fix').style.display=fix?'':'none';
}
function trocarVendaComp(){
  g('cp-bloco-barra').style.display=g('cp-venda').value==='barra'?'':'none';
}

async function salvarComplemento(){
  const v=(id)=>g(id)?.value?.trim()||'';
  const tipo=g('cp-tipo').value;
  const corpo={
    id:v('cp-id')||null, codigo:v('cp-codigo')||null, nome:v('cp-nome'), tipo,
    venda_por:g('cp-venda').value,
    preco:dec(v('cp-preco')),
    comprimento_barra_m:dec(v('cp-barra')),
    aplica_em:tipo==='acabamento'?g('cp-aplica').value||null:null,
    consumo_por_m2:tipo==='fixacao'?dec(v('cp-consumo')):null,
    rendimento_m:dec(v('cp-rend')),
    unidade:v('cp-unidade')||null,
    imagem:v('cp-img')||null, observacao:v('cp-obs')||null,
    ativo:g('cp-ativo').value==='sim',
  };
  if(!corpo.nome)return aviso('cp-msg','bad','Informe o nome do complemento.');
  if(!corpo.preco)return aviso('cp-msg','bad','Informe o preço.');
  try{
    await enviar('/api/painel/complemento',corpo);
    fecharGaveta();await carregar();
  }catch(e){ aviso('cp-msg','bad',esc(e.message)); }
}

/* ═══════════════ FORMULÁRIO: PERFIL ═══════════════ */

  const p=id?perfis.find(x=>x.id===id):null;
  abrirGaveta(
    `<h2>${p?esc(p.nome):'Novo perfil'}</h2>
     <div style="font-size:13px;color:var(--muted)">Estrutura: terças e vigas, vendidas por metro</div>`,
    `<div id="pf-msg" class="msg" hidden></div>
     ${p?._confirmar?'<div class="msg warn">Este perfil está marcado como <b>provisório</b>. Confirme preço e medidas com a fábrica — salvar aqui remove o aviso.</div>':''}
     <input type="hidden" id="pf-id" value="${esc(id||'')}">

     <div class="card">
       <h2>Identificação</h2>
       <div class="grade">
         <div class="campo"><label>Nome <i>*</i></label>
           <input id="pf-nome" value="${esc(p?.nome||'')}" placeholder="Terça Galvanizada Perfil C 150x60x20 #1,55mm"></div>
         <div class="campo"><label>Tipo <i>*</i></label>
           <select id="pf-tipo">
             <option value="terca" ${p?.tipo!=='viga'?'selected':''}>Terça (apoia a telha)</option>
             <option value="viga" ${p?.tipo==='viga'?'selected':''}>Viga (vence o vão)</option>
           </select></div>
         <div class="campo"><label>Código no ERP</label>
           <input id="pf-codigo" value="${esc(p?.codigo||'')}"></div>
         ${campoFoto('pf-img',p?.imagem,'aparece na escolha do cliente e no PDF')}
       </div>
     </div>

     <div class="card">
       <h2>Preço e capacidade</h2>
       <div class="grade g4">
         <div class="campo"><label>Preço por metro (R$) <i>*</i></label>
           <input id="pf-preco" value="${p?.preco??''}" placeholder="48,00"></div>
         <div class="campo"><label>Vão máximo (m) <i>*</i></label>
           <input id="pf-vao" value="${p?.vao_maximo_m??''}" placeholder="6">
           <small>define quantas terças o telhado precisa</small></div>
         <div class="campo"><label>Barra de (m)</label>
           <input id="pf-barra" value="${p?.barra_m??''}" placeholder="6">
           <small>o sistema arredonda para barras inteiras</small></div>
         <div class="campo"><label>Peso (kg/m)</label>
           <input id="pf-peso" value="${p?.peso_kg_m??''}" placeholder="4,2"></div>
         <div class="campo"><label>Ativo?</label>
           <select id="pf-ativo"><option value="sim">Sim</option>
             <option value="nao" ${p?.ativo===false?'selected':''}>Não</option></select></div>
       </div>
     </div>

     <div style="display:flex;gap:9px;position:sticky;bottom:0;background:var(--bg-soft);padding:14px 0">
       <button class="btn" onclick="salvarPerfil()">${p?'Salvar alterações':'Cadastrar perfil'}</button>
       <button class="btn g" onclick="fecharGaveta()">Cancelar</button>
     </div>`
  );
}

async function salvarPerfil(){
  const v=(id)=>g(id)?.value?.trim()||'';
  const corpo={id:v('pf-id')||null, nome:v('pf-nome'), tipo:g('pf-tipo').value,
    codigo:v('pf-codigo')||null, preco:dec(v('pf-preco')), vao_maximo_m:dec(v('pf-vao')),
    barra_m:dec(v('pf-barra'))||6, peso_kg_m:dec(v('pf-peso')),
    imagem:v('pf-img')||null,
    ativo:g('pf-ativo').value==='sim'};
  if(!corpo.nome)return aviso('pf-msg','bad','Informe o nome do perfil.');
  if(!corpo.preco)return aviso('pf-msg','bad','Informe o preço por metro.');
  if(!corpo.vao_maximo_m)return aviso('pf-msg','bad','Informe o vão máximo — é ele que define quantas terças o telhado precisa.');
  try{
    await enviar('/api/painel/perfil',corpo);
    fecharGaveta();await carregar();
  }catch(e){ aviso('pf-msg','bad',esc(e.message)); }
}

/* ── Exclusão ─────────────────────────────────────────────────────── */
async function excluir(qual,id,nome){
  if(!confirm(`Excluir "${nome}"?\n\nOrçamentos já gerados não mudam — o item só deixa de aparecer em novos.`))return;
  try{
    await enviar('/api/painel/'+qual+'/'+encodeURIComponent(id),undefined,'DELETE');
    await carregar();
  }catch(e){ alert(e.message); }
}

carregar();

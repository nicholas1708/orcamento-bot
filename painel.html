<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Orçamentos — 4A</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#f1f5f9;color:#0f172a;padding:20px}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  header h1{font-size:22px}
  header .sp{flex:1}
  .btn{background:#0ea5e9;color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:#0284c7}
  .btn.g{background:#fff;color:#334155;border:1px solid #cbd5e1}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid #e2e8f0}
  .kpi b{display:block;font-size:22px;color:#0f172a;line-height:1.2}
  .kpi small{color:#64748b;font-size:12px}
  .kpi.dest b{color:#0284c7}
  .kpi.ok b{color:#16a34a}
  /* filtros */
  .filtros{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:9px;align-items:end}
  .filtros label{display:block;font-size:11.5px;color:#64748b;margin-bottom:4px;font-weight:600}
  .filtros input,.filtros select{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;outline:none;background:#fff}
  .filtros input:focus,.filtros select:focus{border-color:#0ea5e9}
  /* tabela */
  .tab{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8fafc;text-align:left;padding:10px 12px;font-size:11.5px;color:#64748b;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  tr.l:hover{background:#f8fafc;cursor:pointer}
  .num{font-weight:700;color:#0369a1}
  .mut{color:#94a3b8;font-size:11.5px}
  .val{font-weight:700;white-space:nowrap}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .t-wpp{background:#dcfce7;color:#166534}
  .t-web{background:#dbeafe;color:#1e40af}
  .t-cli{background:#f1f5f9;color:#475569}
  .t-vend{background:#fef3c7;color:#92400e}
  .st{border:1px solid #cbd5e1;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:600;cursor:pointer;background:#fff}
  .st.novo{border-color:#93c5fd;color:#1d4ed8;background:#eff6ff}
  .st.em_negociacao{border-color:#fcd34d;color:#92400e;background:#fffbeb}
  .st.fechado{border-color:#86efac;color:#166534;background:#f0fdf4}
  .st.perdido{border-color:#fca5a5;color:#991b1b;background:#fef2f2}
  .det{background:#f8fafc;padding:0 12px}
  .det .in{padding:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12.5px}
  .det h4{font-size:12px;color:#64748b;text-transform:uppercase;margin-bottom:6px;letter-spacing:.3px}
  .det .ln{padding:3px 0;color:#334155}
  .det .avs{grid-column:1/-1;background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 10px;border-radius:8px}
  .vazio{padding:44px;text-align:center;color:#94a3b8}
  @media(max-width:900px){.filtros{grid-template-columns:1fr 1fr}.det .in{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 Orçamentos</h1>
    <span class="sp"></span>
    <a class="btn g" href="/orcamento?vendedor=Interno" target="_blank">+ Novo orçamento</a>
    <button class="btn g" onclick="exportar()">Exportar CSV</button>
    <button class="btn" onclick="carregar()">Atualizar</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="filtros">
    <div><label>Buscar</label><input id="f-busca" placeholder="número, cliente, telefone, cidade" oninput="deb()"></div>
    <div><label>De</label><input id="f-de" type="date" onchange="carregar()"></div>
    <div><label>Até</label><input id="f-ate" type="date" onchange="carregar()"></div>
    <div><label>Origem</label><select id="f-origem" onchange="carregar()">
      <option value="">Todas</option><option value="cliente">Cliente (autoatendimento)</option><option value="vendedor">Vendedor (interno)</option></select></div>
    <div><label>Canal</label><select id="f-canal" onchange="carregar()">
      <option value="">Todos</option><option value="whatsapp">WhatsApp</option><option value="web">Site</option></select></div>
    <div><label>Situação</label><select id="f-status" onchange="carregar()">
      <option value="">Todas</option><option value="novo">Novo</option><option value="em_negociacao">Em negociação</option>
      <option value="fechado">Fechado</option><option value="perdido">Perdido</option></select></div>
  </div>

  <div class="tab">
    <table>
      <thead><tr>
        <th>Nº</th><th>Data</th><th>Cliente</th><th>Origem</th>
        <th>Produtos</th><th style="text-align:right">Metragem</th>
        <th style="text-align:right">Total</th><th>Situação</th><th></th>
      </tr></thead>
      <tbody id="corpo"></tbody>
    </table>
    <div class="vazio" id="vazio" style="display:none">Nenhum orçamento encontrado com esses filtros.</div>
  </div>
</div>

<script>
let dados=[];
const BRL=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=s=>{const d=new Date(s);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const LABEL={novo:'Novo',em_negociacao:'Em negociação',fechado:'Fechado',perdido:'Perdido'};

let timer;
function deb(){clearTimeout(timer);timer=setTimeout(carregar,350);}

async function carregar(){
  const q=new URLSearchParams();
  const g=id=>document.getElementById(id).value;
  if(g('f-busca'))q.set('busca',g('f-busca'));
  if(g('f-de'))q.set('de',g('f-de'));
  if(g('f-ate'))q.set('ate',g('f-ate'));
  if(g('f-origem'))q.set('origem',g('f-origem'));
  if(g('f-canal'))q.set('canal',g('f-canal'));
  if(g('f-status'))q.set('status',g('f-status'));

  const r=await fetch('/api/painel/orcamentos?'+q).then(r=>r.json()).catch(()=>null);
  if(!r)return;
  dados=r.orcamentos;
  pintarKpis(r.estatisticas);
  pintarTabela();
}

function pintarKpis(e){
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><b>${e.quantidade}</b><small>orçamentos</small></div>
    <div class="kpi dest"><b>R$ ${BRL(e.valorTotal)}</b><small>valor total</small></div>
    <div class="kpi"><b>R$ ${BRL(e.ticketMedio)}</b><small>ticket médio</small></div>
    <div class="kpi"><b>${BRL(e.metragemTotal)} m</b><small>metragem</small></div>
    <div class="kpi ok"><b>${e.fechados} · ${e.conversao}%</b><small>fechados · conversão</small></div>
    <div class="kpi"><b>${e.porOrigem.cliente} / ${e.porOrigem.vendedor}</b><small>cliente / vendedor</small></div>
    <div class="kpi"><b>${e.porCanal.whatsapp} / ${e.porCanal.web}</b><small>WhatsApp / site</small></div>
    <div class="kpi"><b>${e.precisaramVendedor}</b><small>foram p/ vendedor</small></div>`;
}

function pintarTabela(){
  const c=document.getElementById('corpo');
  document.getElementById('vazio').style.display=dados.length?'none':'block';
  c.innerHTML=dados.map((o,i)=>{
    const prods=o.produtos?.length?o.produtos.map(p=>p.nome).join(', '):'—';
    const orig=(o.origem||'cliente')==='vendedor';
    return `<tr class="l" onclick="abrir(${i})">
      <td class="num">${o.numero}</td>
      <td>${dt(o.criadoEm)}</td>
      <td><b>${o.cliente?.nome||'—'}</b><div class="mut">${o.cliente?.telefone||''} · ${o.cliente?.cidade||''}</div></td>
      <td><span class="tag ${orig?'t-vend':'t-cli'}">${orig?(o.vendedor||'Vendedor'):'Cliente'}</span>
          <span class="tag ${o.canal==='whatsapp'?'t-wpp':'t-web'}">${o.canal==='whatsapp'?'WhatsApp':'Site'}</span></td>
      <td>${prods.length>52?prods.slice(0,52)+'…':prods}<div class="mut">${o.totalPecas} peças</div></td>
      <td style="text-align:right">${BRL(o.metragemTotal)} m</td>
      <td style="text-align:right" class="val">R$ ${BRL(o.totalAvista)}
        <div class="mut">${o.totalFrete>0?'frete R$ '+BRL(o.totalFrete):(o.frete&&o.frete.valor===null?'frete a confirmar':'')}</div></td>
      <td onclick="event.stopPropagation()">
        <select class="st ${o.status}" onchange="mudar('${o.numero}',this.value)">
          ${Object.entries(LABEL).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}
        </select></td>
      <td onclick="event.stopPropagation()">${o.pdf?`<a class="btn g" href="${o.pdf}" target="_blank">PDF</a>`:''}</td>
    </tr>
    <tr id="d${i}" style="display:none"><td colspan="9" class="det"><div class="in">
      <div><h4>Itens</h4>${(o.cortes||[]).map(g=>`<div class="ln"><b>${g.nome}</b><br>${g.cortes.map(x=>x.quantidade+' x '+x.comprimentoM+'m').join(' · ')}
        ${g.ambiente?`<div class="mut">calculado de ${g.ambiente.comprimentoGalpaoM}x${g.ambiente.larguraGalpaoM}m, ${g.ambiente.quedas} queda(s)</div>`:''}</div>`).join('')||'—'}</div>
      <div><h4>Entrega e valores</h4>
        <div class="ln">${o.cliente?.endereco||'—'}</div>
        <div class="ln">${o.cliente?.cidade||''}</div>
        ${o.frete?`<div class="ln mut">${o.frete.descricao||''}${o.frete.unidade?' · sai de '+o.frete.unidade:''}</div>`:''}
        <div class="ln">Produtos: R$ ${BRL(o.totalProdutos)}</div>
        <div class="ln">Frete: ${o.totalFrete===null?'a confirmar':'R$ '+BRL(o.totalFrete)}</div>
        <div class="ln"><b>Total: R$ ${BRL(o.totalAvista)}</b></div></div>
      ${o.avisos?.length?`<div class="avs">⚠️ ${o.avisos.join('<br>')}</div>`:''}
    </div></td></tr>`;
  }).join('');
}

function abrir(i){const d=document.getElementById('d'+i);d.style.display=d.style.display==='none'?'table-row':'none';}

async function mudar(numero,status){
  await fetch('/api/painel/status',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({numero,status})});
  carregar();
}

function exportar(){
  const cab=['Numero','Data','Cliente','Telefone','Cidade','Endereco','Origem','Canal','Pecas','Metragem','Produtos','Frete','Total','Situacao'];
  const linhas=dados.map(o=>[o.numero,dt(o.criadoEm),o.cliente?.nome||'',o.cliente?.telefone||'',
    o.cliente?.cidade||'',o.cliente?.endereco||'',o.origem||'cliente',o.canal,o.totalPecas,
    o.metragemTotal,BRL(o.totalProdutos),o.totalFrete===null?'a confirmar':BRL(o.totalFrete),
    BRL(o.totalAvista),LABEL[o.status]||o.status]
    .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'));
  const csv='﻿'+[cab.join(';'),...linhas].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='orcamentos-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// padrão: últimos 30 dias
const hoje=new Date(), atras=new Date(Date.now()-30*864e5);
document.getElementById('f-ate').value=hoje.toISOString().slice(0,10);
document.getElementById('f-de').value=atras.toISOString().slice(0,10);
carregar();
setInterval(carregar,60000); // atualiza sozinho a cada minuto
</script>
</body>
</html>

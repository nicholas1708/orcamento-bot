<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamentos — Painel 4A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/painel/ui.css">
</head>
<body></body>
<script src="/painel/ui.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ORÇAMENTOS — tudo que o sistema gerou, por WhatsApp ou pelo site,
   pelo cliente sozinho ou por um vendedor. Clicar na linha abre a
   ficha completa na gaveta lateral.
   ═══════════════════════════════════════════════════════════════════ */
const SIT={novo:['Novo','info'],em_negociacao:['Em negociação','warn'],
           fechado:['Fechado','ok'],perdido:['Perdido','bad']};
let dados=[];

montarShell('orcamentos','Orçamentos','Gerados pelo site e pelo WhatsApp',
  `<button class="btn g" id="bt-limpar" hidden onclick="abrirLimpeza()">🧹 Limpar testes</button>
   <button class="btn g" onclick="exportar()">⤓ Exportar CSV</button>
   <button class="btn" onclick="carregar()">Atualizar</button>`);

g('corpo').innerHTML=`
  <div class="filtros">
    <div class="campo busca" style="flex:2"><label>Buscar</label>
      <input id="f-busca" placeholder="número, nome, telefone ou cidade" oninput="deb()"></div>
    <div class="campo"><label>De</label><input id="f-de" type="date" onchange="carregar()"></div>
    <div class="campo"><label>Até</label><input id="f-ate" type="date" onchange="carregar()"></div>
    <div class="campo"><label>Quem gerou</label><select id="f-origem" onchange="carregar()">
      <option value="">Todos</option><option value="cliente">Cliente</option>
      <option value="vendedor">Vendedor</option></select></div>
    <!-- só o admin vê: o vendedor já recebe a lista dele filtrada pelo servidor -->
    <div class="campo" id="cx-vendedor" hidden><label>Vendedor</label>
      <select id="f-vendedor" onchange="carregar()"><option value="">Todos</option></select></div>
    <div class="campo"><label>Canal</label><select id="f-canal" onchange="carregar()">
      <option value="">Todos</option><option value="web">Site</option>
      <option value="whatsapp">WhatsApp</option></select></div>
    <div class="campo"><label>Situação</label><select id="f-status" onchange="carregar()">
      <option value="">Todas</option>
      ${Object.entries(SIT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="tabela">
    <table>
      <thead><tr>
        <th>Número</th><th>Data</th><th>Cliente</th><th>Origem</th>
        <th>Produtos</th><th class="num">Metragem</th><th class="num">Total</th>
        <th>Situação</th><th></th>
      </tr></thead>
      <tbody id="lista"></tbody>
    </table>
    <div class="vazio" id="vazio" hidden>
      <b>Nenhum orçamento no período</b>
      Ajuste os filtros acima ou espere o primeiro pedido chegar.
    </div>
  </div>`;

let timer;
const deb=()=>{clearTimeout(timer);timer=setTimeout(carregar,350);};

// O menu já sabe quem entrou (painel-ui.js). Com vendedores cadastrados,
// o admin ganha o filtro por vendedor; o vendedor não vê nem o campo.
function filtroVendedor(eu){
  if(!eu||eu.papel!=='admin'||!(eu.vendedores||[]).length)return;
  g('f-vendedor').innerHTML='<option value="">Todos</option>'
    +eu.vendedores.map(v=>`<option value="${esc(v.id)}">${esc(v.nome)}${v.ativo===false?' (inativo)':''}</option>`).join('')
    +'<option value="sem">— sem vendedor (link público)</option>';
  g('cx-vendedor').hidden=false;
}
/* Limpar testes é só do admin — o vendedor não vê nem o botão.
   O servidor também barra a rota; isto aqui é só para não bater em porta trancada. */
function ajustarAdmin(eu){
  if(eu&&eu.papel==='admin')g('bt-limpar').hidden=false;
}
document.addEventListener('eu',(ev)=>{filtroVendedor(ev.detail);ajustarAdmin(ev.detail);});
filtroVendedor(EU);        // caso a resposta já tenha chegado antes daqui
ajustarAdmin(EU);

async function carregar(){
  const q=new URLSearchParams();
  for(const [p,id] of [['busca','f-busca'],['de','f-de'],['ate','f-ate'],
                       ['origem','f-origem'],['canal','f-canal'],['status','f-status'],
                       ['vendedor','f-vendedor']]){
    const v=g(id)?.value;if(v)q.set(p,v);
  }
  try{
    const r=await pegar('/api/painel/orcamentos?'+q);
    dados=r.orcamentos||[];
    contador('orcamentos',dados.length);
    pintarKpis(r.estatisticas||{});
    pintarLista();
  }catch(e){
    g('lista').innerHTML=`<tr><td colspan="9"><div class="msg bad">${esc(e.message)}</div></td></tr>`;
  }
}

function pintarKpis(e){
  const cartao=(rot,val,det,cls='')=>`<div class="kpi ${cls}"><span>${rot}</span><b>${val}</b>
    ${det?`<i>${det}</i>`:''}</div>`;
  g('kpis').innerHTML=
    cartao('Orçamentos',e.quantidade??0,`${e.porOrigem?.cliente??0} pelo cliente · ${e.porOrigem?.vendedor??0} por vendedor`)+
    cartao('Valor total','R$ '+BRL(e.valorTotal),'ticket médio R$ '+BRL(e.ticketMedio))+
    cartao('Fechados',(e.fechados??0)+' · '+(e.conversao??0)+'%','R$ '+BRL(e.valorFechado))+
    cartao('Metragem',NUM(e.metragemTotal)+' m','soma de todas as peças','q')+
    cartao('Foram ao comercial',e.precisaramVendedor??0,'fora do raio ou acima do limite','q')+
    cartao('Canal',(e.porCanal?.web??0)+' / '+(e.porCanal?.whatsapp??0),'site / WhatsApp','q');
}

function pintarLista(){
  g('vazio').hidden=!!dados.length;
  g('lista').innerHTML=dados.map((o,i)=>{
    const prods=(o.produtos||[]).map(p=>p.nome).join(', ')||'—';
    const vend=(o.origem||'cliente')==='vendedor';
    const [rot,cor]=SIT[o.status]||[o.status,'off'];
    return `<tr class="clicavel" onclick="verFicha(${i})">
      <td><span class="prim" style="font-variant-numeric:tabular-nums">${esc(o.numero)}</span>
        ${o.precisouVendedor?'<div class="sec">↗ comercial</div>':''}</td>
      <td><div class="sec">${dataCurta(o.criadoEm)}</div>
        <div class="sec">${new Date(o.criadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></td>
      <td><div class="prim">${esc(o.cliente?.nome||'—')}</div>
        <div class="sec">${telFmt(o.cliente?.telefone)} · ${esc(o.cliente?.cidade||'')}</div></td>
      <td><span class="tag ${vend?'brand':'off'}">${vend?esc(o.vendedor||'Vendedor'):'Cliente'}</span>
        <div class="sec" style="margin-top:3px">${o.canal==='whatsapp'?'WhatsApp':'Site'}</div></td>
      <td style="max-width:230px"><div class="sec">${esc(prods.length>60?prods.slice(0,60)+'…':prods)}</div>
        <div class="sec">${o.totalPecas||0} peças</div></td>
      <td class="num">${NUM(o.metragemTotal)} m</td>
      <td class="num"><span class="prim">R$ ${BRL(o.totalAvista)}</span>
        <div class="sec">${o.totalFrete>0?'+ frete R$ '+BRL(o.totalFrete)
          :(o.frete&&o.frete.valor===null?'frete a confirmar':'frete grátis')}</div></td>
      <td onclick="event.stopPropagation()">
        <select onchange="mudar('${esc(o.numero)}',this.value)" style="padding:6px 8px;border:1px solid var(--line);
          font-family:inherit;font-size:13px;background:#fff;cursor:pointer">
          ${Object.entries(SIT).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v[0]}</option>`).join('')}
        </select>
        <div style="margin-top:4px"><span class="tag ${cor}">${rot}</span></div></td>
      <td class="acao" onclick="event.stopPropagation()">
        ${o.pdf?`<a class="btn g sm" href="${o.pdf}" target="_blank">PDF</a>`:nada}</td>
    </tr>`;
  }).join('');
}

/* ── Ficha do orçamento ───────────────────────────────────────────── */
function verFicha(i){
  const o=dados[i];
  const [rot,cor]=SIT[o.status]||[o.status,'off'];
  const zap=zapLink(o.cliente?.telefone);

  const itens=(o.cortes||[]).map(gp=>`
    <div style="border-bottom:1px solid var(--line-2);padding:9px 0">
      <b class="cond" style="font-size:15px">${esc(gp.nome||'Produto')}</b>
      <div style="font-size:13.5px;margin-top:2px">${(gp.cortes||[]).map(x=>
        `${x.quantidade} × ${NUM(x.comprimentoM)}m`).join(' · ')||'—'}</div>
      ${gp.ambiente?`<div style="font-size:12px;color:var(--muted);margin-top:2px">
        calculado de ${gp.ambiente.comprimentoGalpaoM}×${gp.ambiente.larguraGalpaoM}m,
        ${gp.ambiente.quedas} água(s)</div>`:''}
    </div>`).join('')||`<div class="vazio">Sem detalhe de itens.</div>`;

  const resumo=(o.produtos||[]).map(p=>`<tr>
      <td>${esc(p.nome)}</td><td class="num">${p.pecas} pç</td>
      <td class="num">${NUM(p.metros)} m</td><td class="num">R$ ${BRL(p.subtotal)}</td></tr>`).join('');

  abrirGaveta(
    `<h2>${esc(o.numero)}</h2>
     <div style="font-size:13px;color:var(--muted)">${data(o.criadoEm)}</div>
     <div style="margin-top:6px"><span class="tag ${cor}">${rot}</span></div>`,
    `<div class="card">
      <span class="eyebrow">Cliente</span>
      ${ficha([
        ['Nome',esc(o.cliente?.nome||'—')],
        ['WhatsApp',telFmt(o.cliente?.telefone)+(zap?` · <a href="${zap}" target="_blank" style="color:var(--brand-dd);font-weight:600">abrir</a>`:'')],
        ['Cidade',esc(o.cliente?.cidade||'—')],
        ['Endereço',esc(o.cliente?.endereco||'—')],
      ])}
      <div style="margin-top:12px"><a class="btn g sm" href="/painel/clientes?tel=${encodeURIComponent(String(o.cliente?.telefone||'').replace(/[^0-9]/g,''))}">Ver cadastro do cliente</a></div>
    </div>

    <div class="card">
      <span class="eyebrow">Valores</span>
      ${ficha([
        ['Produtos','R$ '+BRL(o.totalProdutos)],
        ['Frete',o.totalFrete===null?'a confirmar pelo vendedor':(o.totalFrete>0?'R$ '+BRL(o.totalFrete):'grátis (embutido no preço)')],
        ['Total à vista','<b style="font-size:17px;color:var(--brand-dd)">R$ '+BRL(o.totalAvista)+'</b>'],
        ['Metragem',NUM(o.metragemTotal)+' m · '+(o.totalPecas||0)+' peças'],
        ['Entrega',o.frete?esc(o.frete.descricao||'—')+(o.frete.km?` (${o.frete.km} km)`:''):'—'],
        ['Sai de',o.frete?.unidade?esc(o.frete.unidade):null],
      ])}
    </div>

    ${resumo?`<div class="card"><span class="eyebrow">Por produto</span>
      <div class="tabela" style="border:none"><table><tbody>${resumo}</tbody></table></div></div>`:''}

    <div class="card"><span class="eyebrow">Lista de cortes</span>${itens}</div>

    ${(o.avisos||[]).length?`<div class="msg warn"><b>Observações do cálculo</b>
      <ul>${o.avisos.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}

    <div class="card">
      <span class="eyebrow">Histórico</span>
      ${(o.historico||[]).map(h=>`<div style="display:flex;gap:10px;font-size:13px;padding:6px 0;
        border-bottom:1px solid var(--line-2)">
        <span style="color:var(--muted);white-space:nowrap">${dataCurta(h.em)}</span>
        <span><b>${(SIT[h.status]||[h.status])[0]}</b>${h.nota?' — '+esc(h.nota):''}</span></div>`).join('')}
    </div>

    ${o.pdf?`<a class="btn wide" href="${o.pdf}" target="_blank">📄 Abrir PDF do orçamento</a>`:''}`
  );
}

async function mudar(numero,status){
  try{ await enviar('/api/painel/status',{numero,status}); carregar(); }
  catch(e){ alert(e.message); }
}

/* ═══════════════ LIMPAR TESTES ═══════════════
   Duas etapas de propósito: primeiro mostra o que existe, depois pede o
   clique final. E não apaga — move para lixeira/, que tem volta. */
async function abrirLimpeza(){
  let d;
  try{ d=await (await fetch('/api/painel/limpeza')).json(); }
  catch{ return alert('Não consegui ler o que existe para limpar.'); }

  const mb=(b)=>(b/1024/1024).toFixed(1).replace('.',',');
  const item=(i)=>`
    <label style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
        padding:12px;margin-bottom:8px;${i.sempre?'background:var(--bg-soft)':'cursor:pointer'}">
      <input type="checkbox" class="lm-chk" value="${i.id}" ${i.sempre?'checked disabled':''}
        style="margin-top:2px">
      <span style="flex:1"><b style="font-size:13.5px">${esc(i.rotulo)}</b>
        <small style="display:block;color:var(--muted)">
          ${i.quantidade} arquivo(s) · ${mb(i.bytes)} MB${i.sempre?' · sempre vai junto':''}</small></span>
    </label>`;

  const total=d.itens.filter(i=>i.sempre).reduce((s,i)=>s+i.quantidade,0);

  abrirGaveta(
    `<h2>Limpar testes</h2>
     <div style="font-size:13px;color:var(--muted)">Zera o histórico antes de entrar em produção</div>`,
    `<div id="lm-msg" class="msg" hidden></div>
     <div class="card">
       <h2>O que sai</h2>
       <p class="d">Orçamento e PDF andam juntos — separar deixaria link quebrado
         no painel. O resto é opcional.</p>
       ${d.itens.map(item).join('')}
     </div>
     <div class="card">
       <h2>O que fica</h2>
       <p class="d">Catálogo, produtos, preços, fotos e vendedores. Nada disso é tocado.</p>
     </div>
     <div class="msg info">
       <b>Tem volta.</b> Os arquivos são movidos para uma pasta <code>lixeira/</code>
       com data e hora, não apagados. Se levar algo que não devia, dá para
       recuperar. Quando conferir, você apaga a pasta.
     </div>
     <div style="display:flex;gap:9px;position:sticky;bottom:0;background:var(--bg-soft);padding:14px 0">
       <button class="btn r" id="lm-ok" onclick="executarLimpeza()"
         ${total?'':'disabled'}>Mover para a lixeira</button>
       <button class="btn g" onclick="fecharGaveta()">Cancelar</button>
     </div>`
  );
  if(!total)aviso('lm-msg','info','Não há orçamento nenhum para limpar.');
}

async function executarLimpeza(){
  const marcadas=[...document.querySelectorAll('.lm-chk:checked:not(:disabled)')].map(e=>e.value);
  const btn=g('lm-ok');
  btn.disabled=true;btn.textContent='Movendo…';
  try{
    const r=await enviar('/api/painel/limpeza',{
      clientes:marcadas.includes('clientes'),
      conversas:marcadas.includes('conversas'),
    });
    aviso('lm-msg','ok',`<b>${r.movidos} arquivo(s)</b> movidos para <code>${esc(r.pasta)}/</code>.`);
    btn.textContent='Pronto ✓';
    await carregar();
    setTimeout(fecharGaveta,2200);
  }catch(e){
    aviso('lm-msg','bad',esc(e.message));
    btn.disabled=false;btn.textContent='Mover para a lixeira';
  }
}

function exportar(){
  const cab=['Numero','Data','Cliente','Telefone','Cidade','Endereco','Origem','Canal',
    'Pecas','Metragem','Produtos','Frete','Total','Situacao'];
  const linhas=dados.map(o=>[o.numero,data(o.criadoEm),o.cliente?.nome||'',o.cliente?.telefone||'',
    o.cliente?.cidade||'',o.cliente?.endereco||'',o.origem||'cliente',o.canal,o.totalPecas,
    o.metragemTotal,BRL(o.totalProdutos),o.totalFrete===null?'a confirmar':BRL(o.totalFrete),
    BRL(o.totalAvista),(SIT[o.status]||[o.status])[0]]
    .map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';'));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+[cab.join(';'),...linhas].join('\n')],
    {type:'text/csv;charset=utf-8'}));
  a.download='orcamentos-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// padrão: últimos 30 dias
g('f-ate').value=new Date().toISOString().slice(0,10);
g('f-de').value=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
carregar();
setInterval(carregar,60000);
</script>
</html>

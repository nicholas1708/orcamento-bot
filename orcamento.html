<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento de Telhas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#f1f5f9;min-height:100vh;display:flex;justify-content:center;color:#0f172a}
  .app{width:100%;max-width:560px;padding:16px 16px 48px}
  .topo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .voltar{background:none;border:none;font-size:22px;cursor:pointer;color:#64748b;padding:2px 6px;visibility:hidden}
  .voltar.on{visibility:visible}
  .barra{flex:1;height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .barra i{display:block;height:100%;background:#0ea5e9;transition:width .35s}
  h1{font-size:22px;margin-bottom:6px;line-height:1.25}
  .sub{font-size:14px;color:#64748b;margin-bottom:18px;line-height:1.5}
  /* cartões de escolha */
  .op{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid #e2e8f0;border-radius:14px;
      padding:16px;cursor:pointer;width:100%;text-align:left;margin-bottom:11px;transition:.15s}
  .op:hover{border-color:#7dd3fc;transform:translateY(-1px)}
  .op.on{border-color:#0ea5e9;background:#f0f9ff}
  .op .ico{font-size:28px;flex-shrink:0}
  .op b{display:block;font-size:15px;margin-bottom:2px}
  .op small{color:#64748b;font-size:12.5px;line-height:1.45;display:block}
  .op img{width:64px;height:50px;object-fit:contain;border-radius:9px;flex-shrink:0;background:#f8fafc;padding:3px}
  .chip{display:inline-block;background:#f1f5f9;color:#475569;font-size:10.5px;padding:2px 7px;border-radius:20px;margin:3px 3px 0 0}
  /* campos */
  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:5px}
  .campo input{width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none}
  .campo input:focus{border-color:#0ea5e9}
  .l2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .dica{font-size:12px;color:#94a3b8;margin-top:-8px;margin-bottom:14px}
  .busca{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;margin-bottom:12px}
  /* carrinho / itens */
  .linha{display:grid;grid-template-columns:1fr 78px 78px auto;gap:8px;align-items:center;
         background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .linha b{font-size:13px;display:block;line-height:1.3}
  .linha small{color:#94a3b8;font-size:11px}
  .linha input{padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;outline:none;width:100%;text-align:center}
  .linha input:focus{border-color:#0ea5e9}
  .linha .x{background:#fee2e2;color:#b91c1c;border:none;width:34px;height:34px;border-radius:8px;cursor:pointer}
  .cab{display:grid;grid-template-columns:1fr 78px 78px auto;gap:8px;padding:0 12px 4px;
       font-size:10.5px;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px}
  .cab span:nth-child(n+2){text-align:center}
  /* botões */
  .btn{width:100%;margin-top:16px;padding:15px;background:#0ea5e9;color:#fff;border:none;border-radius:12px;
       font-size:16px;font-weight:700;cursor:pointer}
  .btn:hover{background:#0284c7}
  .btn.sec{background:#fff;color:#0369a1;border:2px solid #bae6fd;margin-top:10px}
  .btn:disabled{background:#cbd5e1;cursor:not-allowed}
  .erro{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px;display:none}
  .aviso{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:11px 14px;border-radius:10px;font-size:13px;margin:12px 0}
  .caixa{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
  /* resumo e final */
  .res .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:13.5px}
  .res .it:last-child{border:none}
  .res .it span:first-child{color:#64748b}
  .res .it span:last-child{font-weight:600;text-align:right;max-width:62%}
  .fim{text-align:center;padding:24px 8px}
  .fim .ok{font-size:52px}.fim h2{margin:8px 0 2px}
  .fim .tt{font-size:32px;font-weight:800;color:#0284c7;margin:6px 0 2px}
  .fim .met{font-size:13px;color:#64748b;margin-bottom:14px}
  .parc{background:#fff;border-radius:12px;padding:12px 14px;text-align:left;font-size:13px}
  .parc div{display:flex;justify-content:space-between;padding:4px 0}
  .fim a.pdf{display:block;margin-top:14px;padding:15px;background:#0ea5e9;color:#fff;border-radius:12px;font-weight:700;text-decoration:none}
  .fim a.zap{display:block;margin-top:12px;padding:15px;background:#25d366;color:#fff;border-radius:12px;font-weight:700;text-decoration:none}
  .fim button{margin-top:12px;background:none;border:none;color:#64748b;cursor:pointer;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <div class="topo">
    <button class="voltar" id="bv" onclick="voltar()">←</button>
    <div class="barra"><i id="pg"></i></div>
  </div>
  <div id="t"></div>
  <div class="erro" id="e"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   DOIS CAMINHOS
   A) "Calcular pra mim" → telha → medidas → 2 perguntas → dados → PDF
   B) "Já sei o que quero" → adiciona itens → dados → PDF
   Nada de mostrar materiais ou descontos na tela: isso é do PDF.
   ══════════════════════════════════════════════════════════════════ */
// Abre direto no "já sei o que quero"; o cálculo automático fica lá dentro.
let cat=null, modo='B', passo=0;
const hist=[];
// Acabamentos e estrutura entram por PADRÃO — o cliente remove se não quiser.
const A={telhaId:null,cg:'',lg:'',quedas:2,famAberta:null,busca:'',
         querAcabamento:true,querEstrutura:true,perfilId:null,trocandoPerfil:false};
const B={itens:[],busca:''};                                   // modo B
const cliente={nome:'',telefone:'',cidade:'',endereco:''};

const T=document.getElementById('t');
const g=id=>document.getElementById(id);
const el=h=>{T.innerHTML=h;window.scrollTo(0,0);};
const err=m=>{const x=g('e');x.textContent=m||'';x.style.display=m?'block':'none';};
const BRL=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const telhaA=()=>cat.telhas.find(x=>x.id===A.telhaId);
const totalPassos=()=>modo==='B'?3:6;

function ocupado(on,txt){
  let o=g('load');
  if(on){
    if(!o){o=document.createElement('div');o.id='load';
      o.style.cssText='position:fixed;inset:0;background:rgba(241,245,249,.9);display:flex;align-items:center;'+
        'justify-content:center;z-index:99;color:#0369a1;font-weight:600;font-size:15px';
      document.body.appendChild(o);}
    o.innerHTML=`<div style="text-align:center"><div style="width:34px;height:34px;border:3px solid #bae6fd;
      border-top-color:#0ea5e9;border-radius:50%;margin:0 auto 10px;animation:gi .8s linear infinite"></div>
      ${txt||'Processando...'}</div><style>@keyframes gi{to{transform:rotate(360deg)}}</style>`;
  }else if(o)o.remove();
}
function ir(n){hist.push(passo);passo=n;err('');render();}
function voltar(){
  if(!hist.length)return;
  passo=hist.pop();
  if(passo===0)modo='B';      // a tela inicial é sempre a de montar o pedido
  err('');render();
}
function barra(){
  g('pg').style.width=((passo+1)/totalPassos()*100)+'%';
  g('bv').className='voltar'+(passo>0?' on':'');
}
/** Todos os itens vendáveis, com a mesma foto usada nos dois caminhos. */
function itensDoCatalogo(){
  return [
    ...cat.telhas.map(t=>({...t,_tipo:'telha'})),
    ...(cat.complementos||[]).map(c=>({...c,_tipo:c.venda_por==='barra'?'barra':'unidade'})),
    ...(cat.perfis||[]).filter(p=>p.ativo!==false).map(p=>({...p,_tipo:'metro'})),
  ];
}
const rotuloUnidade=t=>t==='telha'?'informe quantidade e comprimento'
  :t==='barra'?'vendido por barra':t==='metro'?'vendido por metro':'vendido por peça';
const iconePor=t=>t==='telha'?'🏠':t==='barra'?'📏':t==='metro'?'🔩':'🔧';

const chips=t=>{const a=t.atributos||{},c=[];
  if(a.nucleo)c.push(`${a.nucleo}${a.espessura_isolamento_mm?' '+a.espessura_isolamento_mm+'mm':''}`);
  if(a.perfil)c.push(a.perfil);
  if(a.espessura_chapa_mm)c.push(`chapa ${String(a.espessura_chapa_mm).replace('.',',')}mm`);
  return c.map(x=>`<span class="chip">${x}</span>`).join('');};

/**
 * Opção de tipo de telhado. Usa FOTO REAL quando cadastrada em
 * catalogo.ilustracoes; sem foto, cai no ícone.
 */
function opcaoQueda(n,titulo,desc,icone){
  const url=n===1?cat.ilustracoes?.uma_queda:cat.ilustracoes?.duas_aguas;
  const visual=url
    ? `<img src="${url}" alt="${titulo}" style="width:88px;height:66px;object-fit:cover;border-radius:9px;flex-shrink:0">`
    : `<span class="ico">${icone}</span>`;
  return `<button class="op ${A.quedas===n?'on':''}" onclick="A.quedas=${n};render()">
    ${visual}<span><b>${titulo}</b><small>${desc}</small></span></button>`;
}

/* ── Maquete isométrica (só no caminho "calcular pra mim") ───────── */
function maquete(L,W,q,larguraUtil){
  if(!(L>0)||!(W>0))return `<div style="height:190px;display:flex;align-items:center;justify-content:center;
    color:#94a3b8;font-size:13px;text-align:center">Digite as medidas<br>para ver seu telhado</div>`;
  const hP=Math.max(2.2,Math.min(L,W)*0.16), hT=(q===2?W/2:W)*0.30;
  const c30=Math.cos(Math.PI/6), s30=Math.sin(Math.PI/6);
  const P=(x,y,z)=>[(x-y)*c30,(x+y)*s30-z];
  const b=[P(0,0,0),P(L,0,0),P(L,W,0),P(0,W,0)];
  const t=[P(0,0,hP),P(L,0,hP),P(L,W,hP),P(0,W,hP)];
  const cu=q===2?[P(0,W/2,hP+hT),P(L,W/2,hP+hT)]:[P(0,0,hP+hT),P(L,0,hP+hT)];
  const pts=[...b,...t,...cu];
  const VW=350,VH=190,MG=24;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const s=Math.min((VW-MG*2)/(Math.max(...xs)-Math.min(...xs)),(VH-MG*2)/(Math.max(...ys)-Math.min(...ys)));
  const ox=MG-Math.min(...xs)*s, oy=MG-Math.min(...ys)*s;
  const X=p=>[(p[0]*s+ox).toFixed(1),(p[1]*s+oy).toFixed(1)];
  const poly=a=>a.map(p=>X(p).join(',')).join(' ');
  const n=Math.ceil(L/(larguraUtil||1));
  const passoF=Math.max(1,Math.ceil(n/50))*(larguraUtil||1);
  let rip='';
  for(let x=passoF;x<L-0.01;x+=passoF){
    const seg=q===2?[[P(x,0,hP),P(x,W/2,hP+hT)],[P(x,W,hP),P(x,W/2,hP+hT)]]:[[P(x,W,hP),P(x,0,hP+hT)]];
    seg.forEach(r=>{rip+=`<line x1="${X(r[0])[0]}" y1="${X(r[0])[1]}" x2="${X(r[1])[0]}" y2="${X(r[1])[1]}"
      stroke="#0369a1" stroke-width=".7" opacity=".4"/>`;});
  }
  return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" height="190" style="display:block">
    <polygon points="${poly([b[0],b[1],t[1],t[0]])}" fill="#e2e8f0" stroke="#cbd5e1"/>
    <polygon points="${poly([b[1],b[2],t[2],t[1]])}" fill="#eef2f7" stroke="#cbd5e1"/>
    <polygon points="${poly(q===2?[t[0],t[1],cu[1],cu[0]]:[t[3],t[2],cu[1],cu[0]])}" fill="#38bdf8" stroke="#0284c7" stroke-width="1.4"/>
    ${q===2?`<polygon points="${poly([t[3],t[2],cu[1],cu[0]])}" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.4"/>`:''}
    ${rip}
    ${q===2?`<line x1="${X(cu[0])[0]}" y1="${X(cu[0])[1]}" x2="${X(cu[1])[0]}" y2="${X(cu[1])[1]}"
      stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>`:''}
    <text x="${(+X(b[0])[0]+ +X(b[1])[0])/2}" y="${(+X(b[0])[1]+ +X(b[1])[1])/2+15}" font-size="10"
      fill="#0f172a" text-anchor="middle" font-weight="600">${L} m</text>
    <text x="${(+X(b[1])[0]+ +X(b[2])[0])/2+20}" y="${(+X(b[1])[1]+ +X(b[2])[1])/2+10}" font-size="10"
      fill="#0f172a" text-anchor="middle" font-weight="600">${W} m</text>
  </svg>`;
}
function atualizaMaquete(){
  const box=g('maq');if(!box||!A.telhaId)return;
  box.innerHTML=maquete(parseFloat(String(A.cg).replace(',','.'))||0,
    parseFloat(String(A.lg).replace(',','.'))||0, A.quedas===1?1:2, telhaA().largura_util_m);
}

/* ══════════════ TELAS ══════════════ */
function render(){
  try{desenhar();}catch(e){
    console.error('[wizard]',e);ocupado(false);
    el(`<h1>Ops, algo travou</h1><p class="sub">Tivemos um problema aqui. Tente novamente.</p>
      <button class="btn" onclick="location.reload()">Recomeçar</button>`);
  }
}
function desenhar(){
  barra();

  /* 0 — MONTAR O PEDIDO (tela inicial) */
  if(passo===0){
    const q=B.busca.toLowerCase();
    const todos=itensDoCatalogo();
    const lista=q?todos.filter(x=>(x.nome+' '+(x.codigo||'')).toLowerCase().includes(q)):todos;
    el(`<h1>Monte seu orçamento</h1>
      <p class="sub">Escolha os itens e informe as quantidades.</p>

      <button class="op" style="background:#f0f9ff;border-color:#bae6fd" onclick="modo='A';ir(1)">
        <span class="ico">📐</span><span><b>Não sei as quantidades</b>
        <small>Me diga as medidas do telhado que eu calculo tudo — telhas, acabamentos e estrutura.</small></span></button>

      ${B.itens.length?`<div class="cab" style="margin-top:16px"><span>Item</span><span>Qtd</span><span>Compr.</span><span></span></div>
        ${B.itens.map((it,i)=>{
          const p=todos.find(x=>x.id===it.id)||{};
          return `<div class="linha">
            <span><b>${p.nome||it.id}</b><small>${p.codigo?p.codigo+' · ':''}${rotuloUnidade(it.tipo)}</small></span>
            <input type="number" value="${it.qtd}" placeholder="qtd" oninput="B.itens[${i}].qtd=this.value">
            ${it.tipo==='telha'
              ?`<input type="number" step="0.01" value="${it.comp||''}" placeholder="m" oninput="B.itens[${i}].comp=this.value">`
              :'<span style="text-align:center;color:#cbd5e1">—</span>'}
            <button class="x" onclick="B.itens.splice(${i},1);render()">✕</button></div>`;
        }).join('')}`:''}

      <input class="busca" style="margin-top:16px" placeholder="🔎 Buscar telha, acabamento ou parafuso"
        value="${B.busca}" oninput="B.busca=this.value;render();document.querySelector('.busca').focus()">
      ${lista.slice(0,q?24:10).map(x=>`<button class="op" style="padding:10px 12px" onclick="addItem('${x.id}','${x._tipo}')">
        ${x.imagem
          ?`<img src="${x.imagem}" loading="lazy" style="width:56px;height:44px">`
          :`<span class="ico" style="font-size:20px">${iconePor(x._tipo)}</span>`}
        <span><b style="font-size:13.5px">${x.nome}</b><small>${x.codigo?x.codigo+' · ':''}${rotuloUnidade(x._tipo)}</small></span>
      </button>`).join('')}
      ${!q&&todos.length>10?'<p class="dica" style="margin-top:8px">Use a busca para ver todos os itens.</p>':''}
      ${B.itens.length?'<button class="btn" onclick="okItens()">Continuar →</button>':''}`);
  }

  /* ═══════ CAMINHO A — calcular pra mim ═══════ */
  /* 1 — telha */
  if(passo===1&&modo==='A'){
    const q=A.busca.toLowerCase();
    const lista=q?cat.telhas.filter(t=>(t.nome+' '+t.familia).toLowerCase().includes(q)):cat.telhas;
    el(`<h1>Qual telha?</h1><p class="sub">Cortadas sob medida no comprimento que você precisar.</p>
      ${cat.telhas.length>6?`<input class="busca" placeholder="🔎 Buscar" value="${A.busca}"
        oninput="A.busca=this.value;render();document.querySelector('.busca').focus()">`:''}
      ${lista.map(t=>`<button class="op" onclick="A.telhaId='${t.id}';ir(2)">
        ${t.imagem?`<img src="${t.imagem}" loading="lazy" style="width:56px;height:44px">`:'<span class="ico">🏠</span>'}
        <span><b>${t.nome}</b><span>${chips(t)}</span></span></button>`).join('')
      ||'<p class="sub">Nenhuma telha encontrada.</p>'}`);
  }

  /* 2 — medidas */
  if(passo===2&&modo==='A'){
    el(`<h1>Medidas do telhado</h1><p class="sub">Em metros. É só isso que eu preciso pra calcular tudo.</p>
      <div class="l2">
        <div class="campo"><label>Comprimento</label>
          <input id="mc" type="number" inputmode="decimal" placeholder="20" value="${A.cg}"
            oninput="A.cg=this.value;atualizaMaquete()"></div>
        <div class="campo"><label>Largura</label>
          <input id="ml" type="number" inputmode="decimal" placeholder="10" value="${A.lg}"
            oninput="A.lg=this.value;atualizaMaquete()"></div>
      </div>
      <p class="dica">Comprimento = lado da cumeeira · Largura = lado onde a água escorre</p>
      ${opcaoQueda(1,'1 queda','Água escorre para um lado só','📐')}
      ${opcaoQueda(2,'2 quedas','Duas caídas com cumeeira no topo','⛰️')}
      <div class="caixa" id="maq" style="padding:6px 8px"></div>
      <button class="btn" onclick="okMedidas()">Continuar →</button>`);
    atualizaMaquete();
  }

  /* 3 — o que vai junto (tudo já incluído por padrão) */
  if(passo===3&&modo==='A'){
    const tercas=(cat.perfis||[]).filter(p=>p.tipo==='terca'&&p.ativo!==false);
    const escolhida=tercas.find(p=>p.id===A.perfilId)||tercas[0];
    el(`<h1>O que vai junto</h1>
      <p class="sub">Já incluí o necessário no seu orçamento. Ajuste se quiser.</p>

      <div class="caixa" style="border-color:${A.querAcabamento!==false?'#6ee7b7':'#e2e8f0'};
        background:${A.querAcabamento!==false?'#f0fdf4':'#fff'}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span><b style="font-size:14px">${A.querAcabamento!==false?'✅':'➖'} Acabamentos</b>
            <div style="font-size:12.5px;color:#64748b;margin-top:2px">Cumeeira e arremates das bordas —
              quantidades calculadas pelo seu telhado</div></span>
          <button onclick="A.querAcabamento=(A.querAcabamento===false);render()"
            style="background:none;border:1px solid #cbd5e1;border-radius:8px;padding:7px 12px;font-size:12.5px;
            cursor:pointer;white-space:nowrap;color:#475569">${A.querAcabamento!==false?'Remover':'Incluir'}</button>
        </div></div>

      <div class="caixa" style="border-color:${A.querEstrutura!==false?'#6ee7b7':'#e2e8f0'};
        background:${A.querEstrutura!==false?'#f0fdf4':'#fff'}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span><b style="font-size:14px">${A.querEstrutura!==false?'✅':'➖'} Estrutura</b>
            <div style="font-size:12.5px;color:#64748b;margin-top:2px">
              ${A.querEstrutura!==false&&escolhida?escolhida.nome:'As terças que sustentam as telhas'}</div></span>
          <button onclick="A.querEstrutura=(A.querEstrutura===false);render()"
            style="background:none;border:1px solid #cbd5e1;border-radius:8px;padding:7px 12px;font-size:12.5px;
            cursor:pointer;white-space:nowrap;color:#475569">${A.querEstrutura!==false?'Remover':'Incluir'}</button>
        </div>
        ${A.querEstrutura!==false&&tercas.length>1?`
          <button onclick="A.trocandoPerfil=!A.trocandoPerfil;render()"
            style="background:none;border:none;color:#0369a1;font-size:12.5px;text-decoration:underline;
            cursor:pointer;padding:8px 0 0">${A.trocandoPerfil?'fechar':'trocar o perfil'}</button>
          ${A.trocandoPerfil?tercas.map(p=>`
            <button class="op" style="margin:8px 0 0;padding:11px 13px;background:${p.id===escolhida?.id?'#e0f2fe':'#fff'}"
              onclick="A.perfilId='${p.id}';A.trocandoPerfil=false;render()">
              <span class="ico" style="font-size:19px">🔩</span>
              <span><b style="font-size:13px">${p.nome}</b><small>vence até ${p.vao_maximo_m}m entre apoios</small></span>
            </button>`).join(''):''}`:''}
      </div>

      <button class="btn" onclick="ir(4)">Continuar →</button>`);
  }

  /* ═══════ COMUM ═══════ */
  /* dados */
  if((passo===4&&modo==='A')||(passo===2&&modo==='B')){
    el(`<h1>Seus dados</h1><p class="sub">Precisamos do endereço para a entrega do material.</p>
      <div class="campo"><label>Nome ou empresa</label><input id="dn" value="${cliente.nome}" placeholder="Seu nome"></div>
      <div class="campo"><label>WhatsApp</label><input id="dt" inputmode="tel" value="${cliente.telefone}" placeholder="(17) 99999-9999"></div>
      <div class="campo"><label>Cidade</label><input id="dc" value="${cliente.cidade}" placeholder="São José do Rio Preto - SP"></div>
      <div class="campo"><label>Endereço da obra</label><input id="de" value="${cliente.endereco}" placeholder="Rua Exemplo, 120 - Centro"></div>
      <button class="btn" onclick="okDados()">Gerar orçamento 📄</button>`);
  }

  /* resultado */
  if((passo===5&&modo==='A')||(passo===3&&modo==='B')){
    const r=window._res;
    if(r.encaminhado){
      el(`<div class="fim"><div class="ok">${r.motivo==='volume'?'🎯':'📬'}</div>
        <h2>${r.motivo==='volume'?'Seu pedido rende condição especial':'Pedido registrado'}</h2>
        <p class="sub" style="margin-top:8px">${r.mensagem}</p>
        <div class="caixa" style="text-align:left"><b>Protocolo:</b> ${r.numero}<br>
          <b>Seu pedido:</b> ${r.resumo.totalPecas} peças · ${r.resumo.metragemTotal} mts</div>
        ${r.whatsapp?`<a class="zap" href="${r.whatsapp}" target="_blank">💬 Falar com o comercial</a>`:''}
        <button onclick="location.reload()">Fazer outro orçamento</button></div>`);
      return;
    }
    el(`<div class="fim"><div class="ok">🎉</div><h2>Orçamento ${r.numero}</h2>
      <div class="tt">R$ ${BRL(r.totalAvista)}</div>
      <div class="met">à vista · ${r.totalPecas} peças · ${r.metragemTotal} mts · <b style="color:#059669">frete grátis</b></div>
      <div class="parc">${r.pagamentos.map(p=>`<div><span>${p.parcelas}x</span>
        <span>R$ ${BRL(p.valorParcela)}</span></div>`).join('')}</div>
      <a class="pdf" href="${r.pdf}" target="_blank">📄 Baixar orçamento completo</a>
      <button onclick="location.reload()">Fazer outro orçamento</button></div>`);
  }
}

/* ══════════════ AÇÕES ══════════════ */
function okMedidas(){
  const c=parseFloat(String(A.cg).replace(',','.')),l=parseFloat(String(A.lg).replace(',','.'));
  if(!c||!l||c<=0||l<=0)return err('Preencha comprimento e largura em metros.');
  ir(3);
}
function addItem(id,tipo){
  if(B.itens.some(x=>x.id===id))return err('Esse item já está na lista.');
  B.itens.push({id,tipo,qtd:'',comp:''});B.busca='';err('');render();
}
function okItens(){
  const v=B.itens.filter(x=>+x.qtd>0&&(x.tipo!=='telha'||+x.comp>0));
  if(!v.length)return err('Adicione ao menos um item com quantidade (e comprimento, no caso das telhas).');
  B.itens=v;ir(2);
}
function okDados(){
  cliente.nome=g('dn').value.trim();cliente.telefone=g('dt').value.trim();
  cliente.cidade=g('dc').value.trim();cliente.endereco=g('de').value.trim();
  if(cliente.nome.length<2)return err('Informe seu nome.');
  if(cliente.telefone.replace(/\D/g,'').length<10)return err('Informe um WhatsApp válido com DDD.');
  if(cliente.cidade.length<2)return err('Informe a cidade.');
  if(cliente.endereco.length<8||!/\d/.test(cliente.endereco))return err('Endereço completo com rua, número e bairro.');
  try{localStorage.setItem('cliente4a',JSON.stringify(cliente));}catch(e){}
  gerar();
}

async function gerar(){
  ocupado(true,'Montando seu orçamento...');
  let corpo;
  if(modo==='A'){
    corpo={modo:'auto',
      telhaId:A.telhaId,
      comprimentoGalpaoM:parseFloat(String(A.cg).replace(',','.')),
      larguraGalpaoM:parseFloat(String(A.lg).replace(',','.')),
      quedas:A.quedas,
      querAcabamento:A.querAcabamento!==false,
      querEstrutura:A.querEstrutura!==false,
      perfilId:A.perfilId||null};
  }else{
    corpo={modo:'itens',itens:B.itens.map(x=>({id:x.id,tipo:x.tipo,qtd:+x.qtd,comp:+x.comp||null}))};
  }
  const d=await fetch('/api/orcamento',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pedido:corpo,cliente,vendedor:new URLSearchParams(location.search).get('vendedor')||null})})
    .then(r=>r.json()).catch(()=>({error:'Falha ao gerar — tente de novo.'}));
  ocupado(false);
  if(d.error)return err(d.error);
  window._res=d;
  ir(modo==='A'?5:3);
}

try{const s=localStorage.getItem('cliente4a');if(s)Object.assign(cliente,JSON.parse(s));}catch(e){}

// Veio do visualizador 3D? Retoma o que foi montado lá e pula para os dados.
let _de3d=null;
try{
  const p=sessionStorage.getItem('pedido3d');
  if(p&&new URLSearchParams(location.search).get('de')==='3d'){
    _de3d=JSON.parse(p);sessionStorage.removeItem('pedido3d');
  }
}catch(e){}
fetch('/api/catalogo').then(r=>r.json()).then(c=>{
  cat=c;
  if(_de3d){                                   // monta a ficha vinda do 3D
    if(_de3d.modo==='auto'){
      modo='A';A.telhaId=_de3d.telhaId;A.cg=_de3d.comprimentoGalpaoM;A.lg=_de3d.larguraGalpaoM;
      A.quedas=_de3d.quedas;A.querAcabamento=_de3d.querAcabamento;A.querEstrutura=_de3d.querEstrutura;
      passo=4;                                 // vai direto para os dados
    }else{
      modo='B';B.itens=_de3d.itens.map(i=>({id:i.id,tipo:i.tipo,qtd:i.qtd,comp:i.comp||''}));
      passo=2;
    }
    hist.push(0);
  }
  render();
}).catch(()=>{T.innerHTML='<h1>Ops!</h1><p class="sub">Não consegui carregar o catálogo.</p>';});
</script>
</body>

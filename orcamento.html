<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento de Telhas — 4A Representação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══ Identidade visual do site novo da 4A ═══
     Marca #01A79D · Barlow (texto) + Barlow Condensed (títulos, caixa alta) */
  :root{
    --brand:#01A79D; --brand-d:#00897F; --brand-dd:#036C62; --brand-tint:#E6F7F5;
    --ink:#0E1416; --ink-2:#28353A; --muted:#6B7A7E;
    --line:#E2E7E8; --line-2:#F1F4F4; --bg:#FFFFFF; --bg-soft:#F5F7F7;
    --wa:#25D366; --e:cubic-bezier(.19,.66,.28,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg-soft);min-height:100vh;display:flex;justify-content:center;color:var(--ink);
       font-family:'Barlow',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;
       -webkit-font-smoothing:antialiased}
  h1,h2,b{font-family:'Barlow Condensed',sans-serif}
  .app{width:100%;max-width:600px;padding:16px 18px 52px}
  /* topo */
  .marca{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .marca img{height:40px;width:auto}
  .marca span{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;font-size:13.5px;
    letter-spacing:.06em;line-height:1.1;color:var(--ink);border-left:2px solid var(--brand);padding-left:11px}
  .marca span i{display:block;font-style:normal;color:var(--brand)}
  /* faixa do vendedor — só aparece quando o cliente veio pelo link dele */
  #vend{display:flex;align-items:center;gap:9px;background:var(--brand);color:#fff;
    padding:9px 13px;margin-bottom:14px;font-size:13px}
  #vend b{font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.05em;font-size:14px}
  #vend small{opacity:.85}
  .topo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .voltar{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:2px 6px;visibility:hidden}
  .voltar.on{visibility:visible}
  .barra{flex:1;height:4px;background:var(--line);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--brand);transition:width .4s var(--e)}
  h1{font-size:clamp(26px,5vw,34px);text-transform:uppercase;line-height:1;letter-spacing:-.005em;margin-bottom:8px}
  .sub{font-size:15px;color:var(--muted);margin-bottom:20px;line-height:1.6}
  .eyebrow{display:block;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--brand);margin-bottom:10px}
  /* cartões */
  .op{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);
      padding:16px;cursor:pointer;width:100%;text-align:left;margin-bottom:10px;transition:.25s var(--e)}
  .op:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:0 12px 28px -18px rgba(14,20,22,.4)}
  .op.on{border-color:var(--brand);background:var(--brand-tint);border-left:3px solid var(--brand)}
  .op .ico{font-size:26px;flex-shrink:0}
  .op b{display:block;font-size:17px;text-transform:uppercase;letter-spacing:.01em;margin-bottom:3px;font-weight:700}
  .op small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
  .op img{width:64px;height:50px;object-fit:contain;flex-shrink:0;background:var(--bg-soft);padding:4px}
  /* ── VITRINE DE PRODUTOS ──────────────────────────────────────────
     Escolher telha e acabamento é uma decisão VISUAL: quem compra
     reconhece a peça pela foto, não pelo código. Por isso a foto ocupa
     a largura toda e o nome vem embaixo, curto.
     1 coluna no celular (é onde a foto precisa ser grande), 2 no desktop. */
  .grade{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:10px}
  @media(min-width:560px){.grade{grid-template-columns:1fr 1fr}}
  .card{position:relative;display:block;width:100%;padding:0;text-align:left;background:#fff;
        border:1px solid var(--line);cursor:pointer;transition:.25s var(--e);font-family:inherit;color:inherit}
  .card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(14,20,22,.45)}
  .card.on{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
  .card .foto{position:relative;display:flex;align-items:center;justify-content:center;width:100%;
              aspect-ratio:16/10;background:var(--bg-soft);overflow:hidden}
  /* A foto fica POR CIMA do desenho do perfil. Some a foto (arquivo ainda não
     subiu, CDN fora do ar), aparece o desenho — nunca o ícone de foto quebrada. */
  .card .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
                  padding:10px;display:block;background:var(--bg-soft)}
  .card .foto svg{width:58%;height:auto;max-height:74%}
  .card .txt{display:block;padding:13px 15px 15px}
  .card .txt b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;
               text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
  .card .txt small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:3px}
  /* marca de selecionado (telas onde o cliente desmarca o que não quer) */
  .card .tick{position:absolute;top:11px;right:11px;width:28px;height:28px;display:flex;
    align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;
    border:2px solid var(--line);background:rgba(255,255,255,.94)}
  .card.on .tick{border-color:var(--brand);background:var(--brand)}
  .card.off{opacity:.55}
  .card.off:hover{opacity:1}
  .chip{display:inline-block;background:var(--line-2);color:var(--ink-2);font-size:10.5px;font-weight:500;
    padding:3px 9px;margin:3px 3px 0 0;letter-spacing:.02em}
  /* campos */
  .campo{margin-bottom:15px}
  .campo label{display:block;font-family:'Barlow Condensed';font-size:14px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:6px}
  .campo input{width:100%;padding:14px;border:1px solid var(--line);font-size:16px;outline:none;
    font-family:inherit;background:#fff;transition:.2s}
  .campo input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
  .l2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dica{font-size:12.5px;color:var(--muted);margin-top:-9px;margin-bottom:16px}
  .busca{width:100%;padding:14px;border:1px solid var(--line);font-size:15px;outline:none;
    margin-bottom:12px;font-family:inherit}
  .busca:focus{border-color:var(--brand)}
  /* itens */
  .linha{display:grid;grid-template-columns:1fr 74px 74px auto;gap:8px;align-items:center;
         background:#fff;border:1px solid var(--line);padding:11px 13px;margin-bottom:8px}
  .linha b{font-size:14px;display:block;line-height:1.25;text-transform:none;font-weight:600}
  .linha small{color:var(--muted);font-size:11.5px}
  .linha input{padding:9px;border:1px solid var(--line);font-size:14px;outline:none;width:100%;
    text-align:center;font-family:inherit}
  .linha input:focus{border-color:var(--brand)}
  .linha .x{background:#FEECEC;color:#B42318;border:none;width:34px;height:34px;cursor:pointer;font-size:14px}
  .cab{display:grid;grid-template-columns:1fr 74px 74px auto;gap:8px;padding:0 13px 5px;
       font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
  .cab span:nth-child(n+2){text-align:center}
  /* botões */
  .btn{width:100%;margin-top:18px;padding:16px;background:var(--brand);color:#fff;border:2px solid var(--brand);
       font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;
       letter-spacing:.05em;cursor:pointer;transition:.3s var(--e)}
  .btn:hover{background:var(--brand-dd);border-color:var(--brand-dd)}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--ink);margin-top:10px}
  .btn.sec:hover{background:var(--ink);color:#fff}
  .btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
  .erro{background:#FEECEC;color:#B42318;border-left:3px solid #B42318;padding:12px 15px;font-size:14px;margin-top:14px;display:none}
  .aviso{background:#FFF8E6;border-left:3px solid #D9A400;color:#7A5C00;padding:12px 15px;font-size:13.5px;margin:14px 0}
  .caixa{background:#fff;border:1px solid var(--line);padding:15px;margin-bottom:12px}
  /* resumo e final */
  .res .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}
  .res .it:last-child{border:none}
  .res .it span:first-child{color:var(--muted)}
  .res .it span:last-child{font-weight:600;text-align:right;max-width:62%}
  .fim{text-align:center;padding:28px 8px}
  .fim .ok{font-size:50px}
  .fim h2{margin:10px 0 2px;font-size:30px;text-transform:uppercase;line-height:1}
  .fim .tt{font-family:'Barlow Condensed';font-size:46px;font-weight:700;color:var(--brand);margin:8px 0 0;line-height:1}
  .fim .met{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .parc{background:#fff;border:1px solid var(--line);padding:14px 16px;text-align:left;font-size:14px}
  .parc div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-2)}
  .parc div:last-child{border:none}
  .fim a.pdf{display:block;margin-top:16px;padding:16px;background:var(--brand);color:#fff;font-weight:700;
    text-decoration:none;font-family:'Barlow Condensed';font-size:18px;text-transform:uppercase;letter-spacing:.05em}
  .fim a.pdf:hover{background:var(--brand-dd)}
  .fim a.zap{display:block;margin-top:12px;padding:16px;background:var(--wa);color:#fff;font-weight:700;
    text-decoration:none;font-family:'Barlow Condensed';font-size:18px;text-transform:uppercase;letter-spacing:.05em}
  .fim button{margin-top:14px;background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:13.5px;text-decoration:underline;font-family:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="marca">
    <img src="https://d4polyhz8pjtz.cloudfront.net/5223/logo-3768-20221005184441-06-15-2023-15-51-14-000000.png"
         alt="4A Comércio e Representação de Materiais de Construção">
    <span>Orçamento<i>de telhas</i></span>
  </div>
  <!-- preenchido só quando o cliente veio pelo link de um vendedor -->
  <div id="vend" hidden></div>
  <div class="topo">
    <button class="voltar" id="bv" onclick="voltar()">←</button>
    <div class="barra"><i id="pg"></i></div>
  </div>
  <div id="t"></div>
  <div class="erro" id="e"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   DOIS CAMINHOS
   A) "Calcular pra mim" → telha → medidas → 2 perguntas → dados → PDF
   B) "Já sei o que quero" → adiciona itens → dados → PDF
   Nada de mostrar materiais ou descontos na tela: isso é do PDF.
   ══════════════════════════════════════════════════════════════════ */
// A tela inicial é a escolha do caminho; o orçamento começa depois dela.
let cat=null, modo=null, passo=0;
const hist=[];
// Acabamentos, fixação e estrutura entram por PADRÃO — o cliente desmarca.
const A={telhaId:null,cg:'',lg:'',quedas:2,famAberta:null,busca:'',
         sel:{}, selPronta:false,
         // emenda: quando a água passa do comprimento de fábrica
         opcoes:[], opcaoCorte:null, tamanhoPreferidoM:null, compAgua:null, tamCustom:''};
const B={itens:[],busca:''};                                   // modo B
// Conferência final: a lista que vai ser cobrada, SEM PREÇO, montada pelo servidor.
const R={linhas:null,carregando:false,busca:'',ambiente:null,addAberto:false};
// Endereço em campos separados: o CEP preenche o que souber e a pessoa
// completa o resto. `endereco` é a linha montada, que vai ao motor e ao PDF.
const cliente={nome:'',documento:'',telefone:'',email:'',cep:'',
               rua:'',numero:'',bairro:'',complemento:'',cidade:'',estado:'',endereco:''};

const T=document.getElementById('t');
const g=id=>document.getElementById(id);
const el=h=>{T.innerHTML=h;window.scrollTo(0,0);};
const err=m=>{const x=g('e');x.textContent=m||'';x.style.display=m?'block':'none';};
const BRL=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const telhaA=()=>cat.telhas.find(x=>x.id===A.telhaId);
const totalPassos=()=>modo==='B'?5:8;
/** Passo da conferência em cada caminho — o resto se conta a partir dele. */
const passoConferir=()=>modo==='B'?2:5;

function ocupado(on,txt){
  let o=g('load');
  if(on){
    if(!o){o=document.createElement('div');o.id='load';
      o.style.cssText='position:fixed;inset:0;background:rgba(245,247,247,.94);display:flex;align-items:center;'+
        'justify-content:center;z-index:99;color:#036C62;font-weight:600;font-size:15px';
      document.body.appendChild(o);}
    o.innerHTML=`<div style="text-align:center"><div style="width:34px;height:34px;border:3px solid #E6F7F5;
      border-top-color:#01A79D;border-radius:50%;margin:0 auto 12px;animation:gi .8s linear infinite"></div>
      ${txt||'Processando...'}</div><style>@keyframes gi{to{transform:rotate(360deg)}}</style>`;
  }else if(o)o.remove();
}
/**
 * BUSCA — cada tecla redesenha a tela inteira, então o campo é destruído e
 * recriado a cada letra. O input novo nasce com o cursor na posição 0: a
 * letra seguinte entrava NA FRENTE da anterior e o texto saía de trás pra
 * frente ("telha" virava "ahlet"). Aqui devolvemos o foco E o cursor.
 */
function digitouBusca(alvo,campo,valor){
  const i=document.querySelector('.busca');
  const pos=i?i.selectionStart:valor.length;
  alvo[campo]=valor;
  render();
  const novo=document.querySelector('.busca');
  if(novo){novo.focus();novo.setSelectionRange(pos,pos);}
}
function ir(n){hist.push(passo);passo=n;err('');render();}
function voltar(){
  if(!hist.length)return;
  passo=hist.pop();
  if(passo===0)modo=null;     // voltou para a escolha do caminho
  err('');render();
}
function barra(){
  g('pg').style.width=((passo+1)/totalPassos()*100)+'%';
  g('bv').className='voltar'+(passo>0?' on':'');
}
/**
 * ILUSTRAÇÕES DOS COMPLEMENTOS.
 * A 4A não tem foto desses itens no site (só no PDF do ERP), então desenhamos
 * o perfil de cada peça. Se um dia entrar foto no cadastro, ela tem prioridade.
 */
const DESENHO={
  cumeeira:`<svg viewBox="0 0 64 48"><path d="M6 34 L32 16 L58 34 L58 40 L32 22 L6 40 Z" fill="#01A79D" stroke="#00897F" stroke-width="1.2" stroke-linejoin="round"/><path d="M6 40 L32 22 L58 40" fill="none" stroke="#036C62" stroke-width="1"/></svg>`,
  frontal:`<svg viewBox="0 0 64 48"><path d="M6 30 L58 30 L58 36 L6 36 Z" fill="#E2E7E8" stroke="#9AA8AC" stroke-width="1.1"/><path d="M10 30 l4-8 6 8 M24 30 l4-8 6 8 M38 30 l4-8 6 8" fill="none" stroke="#01A79D" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  lateral:`<svg viewBox="0 0 64 48"><path d="M12 8 L18 8 L18 34 L54 34 L54 40 L12 40 Z" fill="#E2E7E8" stroke="#9AA8AC" stroke-width="1.1" stroke-linejoin="round"/><path d="M18 34 L54 34" stroke="#01A79D" stroke-width="2"/></svg>`,
  interno:`<svg viewBox="0 0 64 48"><path d="M10 12 L54 12 L54 18 L16 18 L16 38 L10 38 Z" fill="#E2E7E8" stroke="#9AA8AC" stroke-width="1.1" stroke-linejoin="round"/><path d="M10 12 L54 12" stroke="#01A79D" stroke-width="2"/></svg>`,
  terca:`<svg viewBox="0 0 64 48"><path d="M14 10 L40 10 L40 16 L20 16 L20 32 L40 32 L40 38 L14 38 Z" fill="#C9D2D4" stroke="#8B989C" stroke-width="1.1" stroke-linejoin="round"/><path d="M44 10 L50 13 L50 41 L44 38 Z" fill="#E2E7E8" stroke="#8B989C" stroke-width="1"/></svg>`,
  viga:`<svg viewBox="0 0 64 48"><path d="M10 12 L54 12 L54 18 L36 18 L36 30 L54 30 L54 36 L10 36 Z" fill="#C9D2D4" stroke="#8B989C" stroke-width="1.1" stroke-linejoin="round"/></svg>`,
  padrao:`<svg viewBox="0 0 64 48"><rect x="12" y="18" width="40" height="12" rx="1" fill="#E2E7E8" stroke="#9AA8AC" stroke-width="1.1"/></svg>`,
};
/** Miniatura do item: foto quando existe, senão o desenho do perfil. */
function mini(item,tam=54){
  const est=`width:${tam}px;height:${Math.round(tam*.78)}px;flex-shrink:0;background:var(--bg-soft);object-fit:contain;padding:3px`;
  if(item.imagem)return `<img src="${item.imagem}" loading="lazy" style="${est}">`;
  const d=DESENHO[item.aplica_em]||DESENHO[item.tipo]||DESENHO.padrao;
  return `<span style="${est};display:flex;align-items:center;justify-content:center">${d}</span>`;
}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/**
 * NOME CURTO PARA A VITRINE.
 * O cadastro vem do ERP com o nome técnico inteiro
 * ("Confort PIR 30mm Trapézio 40/1000 — Galvalume / Branco"), que é o que
 * precisa sair na nota — mas na hora de ESCOLHER só atrapalha.
 * Aqui quebramos em duas partes: o nome que identifica a peça e a variante
 * (cor/acabamento), que é justamente o que diferencia dois itens parecidos.
 *
 * O nome completo continua no atributo title e é ele que vai para o PDF.
 * Para mandar no cadastro, basta preencher "nome_curto" no catalogo.json.
 */
const APARAR=/[\s,·\-–]+$/;
/** Especificação técnica que vem grudada no nome — some do título. */
const ESPEC=[
  /\s*\b(trap[ée]zio|tp)\s*\d+\s*\/\s*\d+\b.*$/i,   // "Trapézio 40/1000 p/ Telha 30mm"
  /\s*\bp\/\s*telha\b.*$/i,
  /\s*\bc\/\s*veda[çc][ãa]o\b.*$/i,
  /\s*\d+\s*x\s*[\d/"x,]+.*$/i,                     // "12x7/8", "150x60x20 #1,55mm"
];
/** Ruído puro: não identifica nem diferencia nada. */
const RUIDO=[/\s*\brosca inteira\b/i, /\s*\bral\s*\d+\b/i];

function nomeCurto(item){
  const bruto=String(item.nome||'');
  const corte=bruto.indexOf('—');
  let titulo=(corte>=0?bruto.slice(0,corte):bruto).trim();
  let variante=corte>=0?bruto.slice(corte+1).trim():'';

  let espec='';
  for(const re of ESPEC){
    const m=titulo.match(re);
    if(!m)continue;
    espec=(espec?espec+' ':'')+m[0].trim();
    titulo=titulo.replace(re,'');
  }
  for(const re of RUIDO)titulo=titulo.replace(re,'');
  titulo=titulo.replace(APARAR,'').trim();

  // Sem nada depois do travessão, o que separa dois itens parecidos é
  // justamente a medida que acabamos de tirar — Perfil C 150x60x20 e
  // Perfil C 100x50x17 virariam o mesmo nome. Ela volta como variante.
  if(!variante)variante=espec.replace(APARAR,'').trim();
  if(item.nome_curto)titulo=item.nome_curto;
  return {titulo:titulo||bruto,variante};
}

/**
 * Imagem grande do cartão. O desenho do perfil vai SEMPRE, e a foto entra por
 * cima quando existe. Se a foto não carregar, ela se remove e o desenho fica —
 * o cliente nunca vê um quadrado quebrado.
 */
function foto(item){
  const desenho=DESENHO[item.aplica_em]||DESENHO[item.tipo]||DESENHO.padrao;
  if(!item.imagem)return desenho;
  return desenho+`<img src="${esc(item.imagem)}" loading="lazy" alt="${esc(item.nome||'')}"
    onerror="this.remove()">`;
}

/**
 * CARTÃO DE PRODUTO — foto grande em cima, nome curto embaixo.
 * @param {object} item      produto do catálogo
 * @param {string} onclick   ação ao tocar no cartão
 * @param {object} opcoes    { detalhe, marcado } — marcado só nas telas de seleção
 */
function cartao(item,onclick,opcoes){
  const o=opcoes||{};
  const n=nomeCurto(item);
  // A variante (cor, medida) fica SEMPRE: é ela que separa dois itens de
  // mesmo nome. O detalhe explica para que serve, e entra depois.
  const legenda=[n.variante, o.detalhe!==undefined?o.detalhe:rotuloUnidade(item._tipo)]
    .filter(Boolean).join(' · ');
  const sel=o.marcado;
  return `<button class="card${sel===true?' on':sel===false?' off':''}" onclick="${onclick}"
      title="${esc(item.nome||'')}">
    ${sel===undefined?'':`<span class="tick">${sel?'✓':''}</span>`}
    <span class="foto">${foto(item)}</span>
    <span class="txt"><b>${esc(n.titulo)}</b>${legenda?`<small>${esc(legenda)}</small>`:''}</span>
  </button>`;
}

/** Todos os itens vendáveis, com a mesma foto usada nos dois caminhos. */
function itensDoCatalogo(){
  return [
    ...cat.telhas.map(t=>({...t,_tipo:'telha'})),
    ...(cat.complementos||[]).map(c=>({...c,_tipo:c.venda_por==='barra'?'barra':'unidade'})),
    ...(cat.perfis||[]).filter(p=>p.ativo!==false).map(p=>({...p,_tipo:'metro'})),
  ];
}
const rotuloUnidade=t=>t==='telha'?'cortada no tamanho que você pedir'
  :t==='barra'?'vendida em barras':t==='metro'?'vendido por metro':'vendido por peça';

const chips=t=>{const a=t.atributos||{},c=[];
  if(a.nucleo)c.push(`${a.nucleo}${a.espessura_isolamento_mm?' '+a.espessura_isolamento_mm+'mm':''}`);
  if(a.perfil)c.push(a.perfil);
  if(a.espessura_chapa_mm)c.push(`chapa ${String(a.espessura_chapa_mm).replace('.',',')}mm`);
  return c.map(x=>`<span class="chip">${x}</span>`).join('');};

/**
 * Opção de tipo de telhado. Usa FOTO REAL quando cadastrada em
 * catalogo.ilustracoes; sem foto, cai no ícone.
 */
function opcaoQueda(n,titulo,desc,icone){
  const url=n===1?cat.ilustracoes?.uma_queda:cat.ilustracoes?.duas_aguas;
  const visual=url
    ? `<img src="${url}" alt="${titulo}" style="width:88px;height:66px;object-fit:cover;border-radius:9px;flex-shrink:0">`
    : `<span class="ico">${icone}</span>`;
  return `<button class="op ${A.quedas===n?'on':''}" onclick="A.quedas=${n};render()">
    ${visual}<span><b>${titulo}</b><small>${desc}</small></span></button>`;
}

/* ── Maquete isométrica (só no caminho "calcular pra mim") ───────── */
function maquete(L,W,q,larguraUtil){
  if(!(L>0)||!(W>0))return `<div style="height:190px;display:flex;align-items:center;justify-content:center;
    color:#94a3b8;font-size:13px;text-align:center">Digite as medidas<br>para ver seu telhado</div>`;
  const hP=Math.max(2.2,Math.min(L,W)*0.16), hT=(q===2?W/2:W)*0.30;
  const c30=Math.cos(Math.PI/6), s30=Math.sin(Math.PI/6);
  const P=(x,y,z)=>[(x-y)*c30,(x+y)*s30-z];
  const b=[P(0,0,0),P(L,0,0),P(L,W,0),P(0,W,0)];
  const t=[P(0,0,hP),P(L,0,hP),P(L,W,hP),P(0,W,hP)];
  const cu=q===2?[P(0,W/2,hP+hT),P(L,W/2,hP+hT)]:[P(0,0,hP+hT),P(L,0,hP+hT)];
  const pts=[...b,...t,...cu];
  const VW=350,VH=190,MG=24;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const s=Math.min((VW-MG*2)/(Math.max(...xs)-Math.min(...xs)),(VH-MG*2)/(Math.max(...ys)-Math.min(...ys)));
  const ox=MG-Math.min(...xs)*s, oy=MG-Math.min(...ys)*s;
  const X=p=>[(p[0]*s+ox).toFixed(1),(p[1]*s+oy).toFixed(1)];
  const poly=a=>a.map(p=>X(p).join(',')).join(' ');
  const n=Math.ceil(L/(larguraUtil||1));
  const passoF=Math.max(1,Math.ceil(n/50))*(larguraUtil||1);
  let rip='';
  for(let x=passoF;x<L-0.01;x+=passoF){
    const seg=q===2?[[P(x,0,hP),P(x,W/2,hP+hT)],[P(x,W,hP),P(x,W/2,hP+hT)]]:[[P(x,W,hP),P(x,0,hP+hT)]];
    seg.forEach(r=>{rip+=`<line x1="${X(r[0])[0]}" y1="${X(r[0])[1]}" x2="${X(r[1])[0]}" y2="${X(r[1])[1]}"
      stroke="#036C62" stroke-width=".7" opacity=".4"/>`;});
  }
  return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" height="190" style="display:block">
    <polygon points="${poly([b[0],b[1],t[1],t[0]])}" fill="#e2e8f0" stroke="#cbd5e1"/>
    <polygon points="${poly([b[1],b[2],t[2],t[1]])}" fill="#eef2f7" stroke="#cbd5e1"/>
    <polygon points="${poly(q===2?[t[0],t[1],cu[1],cu[0]]:[t[3],t[2],cu[1],cu[0]])}" fill="#2FC3B9" stroke="#00897F" stroke-width="1.4"/>
    ${q===2?`<polygon points="${poly([t[3],t[2],cu[1],cu[0]])}" fill="#01A79D" stroke="#00897F" stroke-width="1.4"/>`:''}
    ${rip}
    ${q===2?`<line x1="${X(cu[0])[0]}" y1="${X(cu[0])[1]}" x2="${X(cu[1])[0]}" y2="${X(cu[1])[1]}"
      stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>`:''}
    <text x="${(+X(b[0])[0]+ +X(b[1])[0])/2}" y="${(+X(b[0])[1]+ +X(b[1])[1])/2+15}" font-size="10"
      fill="#0f172a" text-anchor="middle" font-weight="600">${L} m</text>
    <text x="${(+X(b[1])[0]+ +X(b[2])[0])/2+20}" y="${(+X(b[1])[1]+ +X(b[2])[1])/2+10}" font-size="10"
      fill="#0f172a" text-anchor="middle" font-weight="600">${W} m</text>
  </svg>`;
}
function atualizaMaquete(){
  const box=g('maq');if(!box||!A.telhaId)return;
  box.innerHTML=maquete(parseFloat(String(A.cg).replace(',','.'))||0,
    parseFloat(String(A.lg).replace(',','.'))||0, A.quedas===1?1:2, telhaA().largura_util_m);
}

  if(passo===2&&modo==='A'){

        :'<div class="caixa" style="text-align:center;color:var(--muted)">Sua lista está vazia — adicione um item abaixo.</div>'}

      <div class="caixa" id="tot" style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:var(--muted);font-size:13px">${telhas.length?'Telhas':'Itens'}</span>
        <b>${telhas.length
          ? `${telhas.reduce((s,l)=>s+(+l.qtd||0),0)} peças · ${mts.toFixed(2).replace('.',',')} metros`
          : `${R.linhas.length} produto${R.linhas.length===1?'':'s'}`}</b>
      </div>

      ${R.addAberto?`
        <input class="busca" placeholder="🔎 Qual produto?" value="${R.busca}"
          oninput="digitouBusca(R,'busca',this.value)">
        ${achados.length?`<div class="grade">
          ${achados.slice(0,12).map(x=>cartao(x,`addNaLista('${x.id}')`)).join('')}
        </div>`
          :(q?'<p class="dica">Nada encontrado com esse nome.</p>':'<p class="dica">Digite para procurar no catálogo.</p>')}
        <button class="op" style="justify-content:center;padding:12px" onclick="R.addAberto=false;R.busca='';render()">
          <span><b>Fechar</b></span></button>`
        :`<button class="op" style="justify-content:center;padding:14px" onclick="R.addAberto=true;render()">
          <span><b style="color:var(--brand)">+ Adicionar outro produto</b></span></button>`}

      <button class="btn" onclick="okConferir()">Continuar →</button>`);
  }

  /* dados */
  if(passo===passoConferir()+1){
    el(`<h1>Seus dados</h1><p class="sub">Precisamos do endereço para entregar e do documento para emitir.</p>
      <div class="campo"><label>Seu nome</label><input id="dn" value="${cliente.nome}" placeholder="Nome ou empresa"></div>
      <div class="campo"><label>CPF ou CNPJ</label>
        <input id="dd" inputmode="numeric" value="${cliente.documento}" placeholder="000.000.000-00"></div>
      <div class="campo"><label>WhatsApp</label><input id="dt" inputmode="tel" value="${cliente.telefone}" placeholder="(17) 99999-9999"></div>
      <div class="campo"><label>E-mail <i style="font-style:normal;color:var(--muted);font-weight:400">(opcional)</i></label>
        <input id="dm" type="email" value="${cliente.email}" placeholder="voce@email.com"></div>
      <span class="eyebrow" style="margin-top:22px">Onde entregar</span>
      <div class="campo"><label>CEP da obra</label>
        <input id="dp" inputmode="numeric" value="${cliente.cep}" placeholder="15000-000"
          oninput="buscarCep(this.value)">
        <small id="cepmsg" class="dica">Digite o CEP que eu preencho o resto — só o número fica com você.</small></div>

      <div class="l2" style="grid-template-columns:1fr 100px">
        <div class="campo"><label>Rua</label>
          <input id="dr" value="${cliente.rua}" placeholder="Rua Exemplo"></div>
        <div class="campo"><label>Número</label>
          <input id="dnum" value="${cliente.numero}" placeholder="120"></div>
      </div>
      <div class="l2">
        <div class="campo"><label>Bairro</label>
          <input id="db" value="${cliente.bairro}" placeholder="Centro"></div>
        <div class="campo"><label>Complemento <i style="font-style:normal;color:var(--muted);font-weight:400">(opcional)</i></label>
          <input id="dcp" value="${cliente.complemento}" placeholder="fundos, galpão 2"></div>
      </div>
      <div class="l2" style="grid-template-columns:1fr 90px">
        <div class="campo"><label>Cidade</label>
          <input id="dc" value="${cliente.cidade}" placeholder="São José do Rio Preto"></div>
        <div class="campo"><label>Estado</label>
          <input id="du" value="${cliente.estado}" placeholder="SP" maxlength="2" style="text-transform:uppercase"></div>
      </div>
      <button class="btn" onclick="okDados()">Ver meu orçamento</button>`);
  }

  /* resultado */
  if(passo===passoConferir()+2){
    const r=window._res;
    if(r.encaminhado){
      el(`<div class="fim"><div class="ok">${r.motivo==='volume'?'🎯':'📬'}</div>
        <h2>${r.motivo==='volume'?'Seu pedido rende condição especial':'Pedido registrado'}</h2>
        <p class="sub" style="margin-top:8px">${r.mensagem}</p>
        <div class="caixa" style="text-align:left"><b>Protocolo:</b> ${r.numero}<br>
          <b>Seu pedido:</b> ${r.resumo.totalPecas} peças · ${r.resumo.metragemTotal} mts</div>
        ${r.whatsapp?`<a class="zap" href="${r.whatsapp}" target="_blank">💬 Falar com o comercial</a>`:''}
        <button onclick="location.reload()">Fazer outro orçamento</button></div>`);
      return;
    }
    el(`<div class="fim"><div class="ok">🎉</div><h2>Orçamento ${r.numero}</h2>
      <div class="tt">R$ ${BRL(r.totalAvista)}</div>
      <div class="met">à vista · ${r.totalPecas} peças · ${r.metragemTotal} mts · <b style="color:var(--brand)">frete grátis</b></div>
      <div class="parc">${r.pagamentos.map(p=>`<div><span>${p.parcelas}x</span>
        <span>R$ ${BRL(p.valorParcela)}</span></div>`).join('')}</div>
      <a class="pdf" href="${r.pdf}" target="_blank">📄 Baixar orçamento completo</a>
      <button onclick="location.reload()">Fazer outro orçamento</button></div>`);
  }
}

/* ══════════════ AÇÕES ══════════════ */
/**
 * Marca tudo na primeira vez que a tela abre.
 * Acabamentos e fixação: todos. Estrutura: um perfil de cada tipo — marcar
 * duas terças diferentes cobraria a estrutura em dobro.
 */
/**
 * O que faz sentido no telhado escolhido.
 * Cumeeira fecha o encontro das duas águas — em 1 água ela não existe,
 * e o cálculo do perímetro já devolve zero metro pra ela. Some da tela
 * pra não parecer que o cliente está levando uma peça que não vai no PDF.
 */
function complementosAplicaveis(){
  const t=telhaA()||{};
  // só o que está VINCULADO a esta telha (sem vínculo, tudo que é ativo).
  // É o que impede telha branca aparecer com cumeeira galvalume.
  const vinculo=t.compativeis&&t.compativeis.complementos;
  return (cat.complementos||[]).filter(c=>
    c.ativo!==false
    && (!Array.isArray(vinculo)||vinculo.indexOf(c.id)>=0)
    && !(c.aplica_em==='cumeeira' && A.quedas!==2));
}
/** Perfis que acompanham a telha escolhida. */
function perfisAplicaveis(){
  const t=telhaA()||{};
  const vinculo=t.compativeis&&t.compativeis.perfis;
  return (cat.perfis||[]).filter(p=>
    p.ativo!==false && (!Array.isArray(vinculo)||vinculo.indexOf(p.id)>=0));
}

function inicializarSelecao(){
  if(A.selPronta)return;
  for(const c of (cat.complementos||[]))A.sel[c.id]=true;
  const vistos={};
  for(const p of (cat.perfis||[]).filter(x=>x.ativo!==false)){
    A.sel[p.id]=!vistos[p.tipo];
    vistos[p.tipo]=true;
  }
  A.selPronta=true;
}
function toggleSel(id){A.sel[id]=!A.sel[id];render();}

/**
 * Antes de seguir, pergunta ao servidor se a água cabe numa peça só.
 * Se não couber, o cliente escolhe COMO emendar — em vez de o sistema
 * decidir sozinho pelo plano de menos emendas.
 */
async function okMedidas(){
  const c=parseFloat(String(A.cg).replace(',','.')),l=parseFloat(String(A.lg).replace(',','.'));
  if(!c||!l||c<=0||l<=0)return err('Preencha comprimento e largura em metros.');

  ocupado(true,'Calculando o corte...');
  const d=await fetch('/api/romaneio',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({telhaId:A.telhaId,comprimentoGalpaoM:c,larguraGalpaoM:l,quedas:A.quedas})})
    .then(r=>r.json()).catch(()=>null);
  ocupado(false);

  if(!d||d.error)return err(d?.error||'Não consegui calcular o corte — tente de novo.');

  A.compAgua=d.compTelha;
  A.opcoes=d.opcoes||[];
  if(!d.precisaEscolher){                 // cabe numa peça só: nada a decidir
    A.opcaoCorte=null;A.tamanhoPreferidoM=null;
    return ir(4);
  }
  A.opcaoCorte=A.opcaoCorte||A.opcoes[0]?.id||null;
  ir(3);
}

/** Cliente quer peças de um tamanho específico — o servidor monta o plano. */
async function usarTamanho(){
  const v=parseFloat(String(A.tamCustom).replace(',','.'));
  if(!v||v<=0)return err('Informe o tamanho da peça em metros.');
  ocupado(true,'Montando o corte...');
  const d=await fetch('/api/opcoes-corte',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({telhaId:A.telhaId,comprimentoM:A.compAgua,tamanhoPreferidoM:v})})
    .then(r=>r.json()).catch(()=>null);
  ocupado(false);
  if(!d||d.error)return err(d?.error||'Não consegui montar esse corte.');
  if(!d.personalizada||d.personalizada.erro)return err(d.personalizada?.erro||'Esse tamanho não fecha a água.');

  A.opcoes=[d.personalizada,...(d.opcoes||[])];
  A.opcaoCorte=d.personalizada.id;
  A.tamanhoPreferidoM=v;
  err('');render();
}
/**
 * Legenda da linha do pedido. Fica fora do render justamente pra poder ser
 * reescrita sozinha enquanto o cliente digita, sem derrubar o foco do campo.
 */
function legendaItem(it,p){
  const cod=p.codigo?p.codigo+' · ':'';
  if(it.tipo!=='telha')return cod+rotuloUnidade(it.tipo);
  const qtd=+it.qtd, comp=parseFloat(String(it.comp).replace(',','.'));
  if(!(qtd>0)||!(comp>0))return cod+'quantas peças e de que comprimento';
  return `${cod}${qtd} telhas de ${String(it.comp).replace('.',',')}m = `+
    `${(qtd*comp).toFixed(2).replace('.',',')} metros`;
}
function legenda(i){
  const el=g('leg-'+i);if(!el)return;
  const it=B.itens[i];if(!it)return;
  el.textContent=legendaItem(it,itensDoCatalogo().find(x=>x.id===it.id)||{});
}

/**
 * Quantidade é peça inteira e nunca negativa — não existe meia cumeeira
 * nem -3 parafusos. Roda quando o cliente sai do campo.
 */
function arrumaItem(i){
  const it=B.itens[i];if(!it)return;
  let v=parseFloat(String(it.qtd).replace(',','.'));
  if(!Number.isFinite(v)||v<0)v=0;
  it.qtd=Math.ceil(v);

  if(it.tipo==='telha'){
    const c=parseFloat(String(it.comp).replace(',','.'));
    const {min,max,nome}=limitesDaTelha(it.id);
    if(!Number.isFinite(c)||c<0){ it.comp=''; }
    // Avisa na hora, sem mexer no que a pessoa digitou: mudar a medida
    // por conta própria seria pior do que apontar o erro.
    else if(c>max){
      err(`${nome}: a fábrica corta até ${String(max).replace('.',',')}m. `+
        `Para peça maior é emenda — deixe eu calcular pelas medidas do local.`);
    }
    else if(c>0&&c<min){
      err(`${nome}: o menor corte é ${String(min).replace('.',',')}m.`);
    }
    else err('');
  }
  render();
}

/**
 * A MESMA TELHA PODE ENTRAR VÁRIAS VEZES — uma linha por comprimento.
 * É assim que o orçamento da empresa é montado: o mesmo produto repetido
 * em 4m, 4,75m, 6,20m... O que não se repete é acabamento e perfil, que
 * têm uma quantidade só.
 */
function addItem(id,tipo){
  if(tipo!=='telha'&&B.itens.some(x=>x.id===id))
    return err('Esse item já está na lista — é só ajustar a quantidade.');
  B.itens.push({id,tipo,qtd:'',comp:''});B.busca='';err('');render();
}
/**
 * LIMITE DE CORTE — a largura é fixa de fábrica, o comprimento é livre.
 * A única fronteira é o que a máquina corta: do mínimo ao máximo cadastrado.
 */
function limitesDaTelha(id){
  const t=(cat.telhas||[]).find(x=>x.id===id)||{};
  const min=+t.comprimento_minimo_m||+cat.engenharia?.comprimento_minimo_fabricacao_m||0.5;
  const max=+t.comprimento_maximo_m||+cat.engenharia?.comprimento_maximo_fabricacao_m||12;
  return {min,max,nome:t.nome||'telha'};
}
/** Limite da telha que está no pedido — não do catálogo inteiro. */
function limiteTexto(){
  const t=B.itens.find(x=>x.tipo==='telha');
  if(!t)return '';
  const {min,max}=limitesDaTelha(t.id);
  return `Cortamos de ${String(min).replace('.',',')}m até ${String(max).replace('.',',')}m.`;
}

function okItens(){
  const v=B.itens.filter(x=>+x.qtd>0&&(x.tipo!=='telha'||+x.comp>0));
  if(!v.length)return err('Preencha a quantidade — e o comprimento, no caso das telhas.');
  for(const x of v){
    if(x.tipo!=='telha')continue;
    const {min,max,nome}=limitesDaTelha(x.id);
    const c=+x.comp;
    if(c<min)return err(`${nome}: o menor corte é ${String(min).replace('.',',')}m.`);
    if(c>max)return err(`${nome}: a fábrica corta até ${String(max).replace('.',',')}m. `+
      `Para peça maior, é emenda com transpasse — deixe eu calcular pelas medidas do local.`);
  }
  B.itens=v;irConferir();
}
/** Sem itens ainda? Oferece o cálculo automático em vez de deixar o cliente travado. */
function irParaCalculo(){modo='A';B.itens.length=0;R.linhas=null;ir(1);}

/* ── CONFERÊNCIA ────────────────────────────────────────────────────
   A lista é montada pelo SERVIDOR (mesma regra que calcula o preço).
   Aqui o cliente só ajusta quantidade, tira e acrescenta item.
   Tamanho de telha não se digita: é o que está no cadastro.          */
function irConferir(){R.linhas=null;R.addAberto=false;R.busca='';ir(passoConferir());}

function corpoDoPedido(){
  if(modo==='A'){
    const marcados=Object.keys(A.sel).filter(k=>A.sel[k]);
    // se o cliente voltou e trocou de 2 águas para 1, a cumeeira marcada
    // antes não pode ir junto
    const aplicaveis=complementosAplicaveis().map(c=>c.id);
    return {modo:'auto',
      telhaId:A.telhaId,
      comprimentoGalpaoM:parseFloat(String(A.cg).replace(',','.')),
      larguraGalpaoM:parseFloat(String(A.lg).replace(',','.')),
      quedas:A.quedas,
      opcaoCorte:A.opcaoCorte,               // como emendar, quando a água é longa
      tamanhoPreferidoM:A.tamanhoPreferidoM,
      complementosIds:marcados.filter(id=>aplicaveis.includes(id)),
      perfisIds:marcados.filter(id=>perfisAplicaveis().some(p=>p.id===id))};
  }
  return {modo:'itens',itens:B.itens.map(x=>({id:x.id,tipo:x.tipo,qtd:+x.qtd,comp:+x.comp||null}))};
}

/* Link do vendedor: /orcamento?v=slug. Vai junto em toda chamada.
   Quem confere é o servidor — aqui é só transporte. */
const VSLUG=new URLSearchParams(location.search).get('v')||null;

/** Faixa "Atendimento: Fulano". Só o nome e o telefone, nunca dado interno. */
function mostrarVendedor(v){
  const el=document.getElementById('vend');
  if(!el||!v||!v.nome)return;
  el.innerHTML=`<b>Atendimento: ${esc(v.nome)}</b>`
    +(v.telefone?` <small>· ${esc(v.telefone)}</small>`:'');
  el.hidden=false;
}

async function carregarLista(){
  R.carregando=true;
  let d;
  try{
    const r=await fetch('/api/lista',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pedido:corpoDoPedido(),vendedorSlug:VSLUG})});
    const txt=await r.text();
    try{ d=JSON.parse(txt); }
    catch{
      // resposta não é JSON: quase sempre a rota não existe no servidor
      // que está no ar (faltou reiniciar depois de atualizar o código)
      console.error('[lista] resposta inesperada',r.status,txt.slice(0,200));
      d={error:r.status===404
        ? 'O servidor está numa versão antiga (rota /api/lista não existe). Reinicie o serviço.'
        : `O servidor respondeu ${r.status} sem detalhe. Veja o log do serviço.`};
    }
  }catch(e){
    console.error('[lista]',e);
    d={error:'Não consegui falar com o servidor. Confira a conexão e tente de novo.'};
  }
  R.carregando=false;
  if(d.error){R.linhas=[];render();return err(d.error);}
  R.linhas=d.linhas||[];
  R.ambiente=d.ambiente||null;
  render();
}
/**
 * Só o que é vendido POR METRO aceita quebrado. Cumeeira, frontal e
 * parafuso são peça inteira — não existe meia cumeeira.
 */
const porMetro=(l)=>l.rotulo==='metros';

/** Arruma a quantidade quando o cliente sai do campo: nada negativo, e
 *  peça inteira arredonda pra cima (0,05 de cumeeira vira 1). */
function ajustarQtd(i){
  const l=R.linhas[i];if(!l)return;
  let v=parseFloat(String(l.qtd).replace(',','.'));
  if(!Number.isFinite(v)||v<0)v=0;
  if(!porMetro(l))v=Math.ceil(v);          // peça inteira (telha inclusive)
  l.qtd=v;
}

/** Atualiza só o rodapé — reescrever a tela faria o campo perder o foco. */
function totConferir(){
  const box=g('tot');if(!box)return;
  const t=R.linhas.filter(l=>l.tipo==='telha');
  if(!t.length){
    box.innerHTML=`<span style="color:var(--muted);font-size:13px">Itens</span>
      <b>${R.linhas.length} produto${R.linhas.length===1?'':'s'}</b>`;
    return;
  }
  const pecas=t.reduce((s,l)=>s+(+l.qtd||0),0);
  const mts=t.reduce((s,l)=>s+(+l.qtd||0)*(+l.comp||0),0);
  box.innerHTML=`<span style="color:var(--muted);font-size:13px">Telhas</span>
    <b>${pecas} peças · ${mts.toFixed(2).replace('.',',')} metros</b>`;
}
function addNaLista(id){
  const x=itensDoCatalogo().find(y=>y.id===id);if(!x)return;
  const ehTelha=x._tipo==='telha';
  // telha repete (um comprimento por linha); acabamento e perfil, não
  if(!ehTelha&&R.linhas.some(l=>l.id===id))
    return err('Esse produto já está na lista — é só ajustar a quantidade.');
  const ehPerfil=(cat.perfis||[]).some(p=>p.id===id);
  R.linhas.push({
    id, tipo:ehTelha?'telha':ehPerfil?'perfil':'complemento',
    nome:x.nome, codigo:x.codigo||null, imagem:x.imagem||null,
    desenho:x.aplica_em||x.tipo||null,
    qtd:'', comp:ehTelha?'':null,
    rotulo:ehTelha?'peças':x.venda_por==='metro'||(ehPerfil&&x.unidade!=='UN')?'metros'
      :x.venda_por==='barra'?'barras':'peças',
    detalhe:null,
  });
  R.addAberto=false;R.busca='';err('');render();
}
function okConferir(){
  (R.linhas||[]).forEach((l,i)=>ajustarQtd(i));   // nada negativo nem quebrado
  // Telha não é obrigatória: dá pra orçar só acabamento, parafuso ou estrutura.
  const v=(R.linhas||[]).filter(l=>+l.qtd>0);
  if(!v.length)return err('Coloque ao menos um produto com quantidade.');
  for(const l of v){
    if(l.tipo!=='telha')continue;
    const {min,max,nome}=limitesDaTelha(l.id);
    const c=+l.comp;
    if(!(c>0))return err(`${nome}: informe o comprimento da peça.`);
    if(c<min)return err(`${nome}: o menor corte é ${String(min).replace('.',',')}m.`);
    if(c>max)return err(`${nome}: a fábrica corta até ${String(max).replace('.',',')}m — peça maior precisa de emenda.`);
  }
  R.linhas=v;ir(passoConferir()+1);
}

/** CEP → cidade. Serve para medir a distância até a unidade mais próxima. */
let _cepTimer=null;
function buscarCep(v){
  cliente.cep=v;
  const d=v.replace(/\D/g,'');
  const msg=g('cepmsg');if(msg)msg.textContent=d.length===8?'Procurando...':'';
  clearTimeout(_cepTimer);
  if(d.length!==8)return;
  _cepTimer=setTimeout(async()=>{
    const r=await fetch('/api/cep/'+d).then(x=>x.json()).catch(()=>null);
    const m=g('cepmsg');
    if(!r||!r.cidade){
      if(m)m.textContent='CEP não encontrado — preencha o endereço abaixo.';
      return;
    }
    // preenche o que a base sabe; o que vier vazio fica pro cliente
    const põe=(id,campo,valor)=>{
      if(!valor)return;
      cliente[campo]=valor;
      const c=g(id);if(c)c.value=valor;
    };
    põe('dc','cidade',r.cidade);
    põe('du','estado',r.uf);
    põe('dr','rua',r.rua);
    põe('db','bairro',r.bairro);

    if(m){
      // cidade de CEP único não tem rua nem bairro na base — avisa em vez
      // de deixar a pessoa achando que o campo travou
      m.textContent=(r.rua&&r.bairro)
        ? `${r.cidade} - ${r.uf}. Agora só o número.`
        : `${r.cidade} - ${r.uf}. Esse CEP não tem rua cadastrada — preencha rua e bairro.`;
    }
    const alvo=g(r.rua?'dnum':'dr');
    if(alvo&&!alvo.value)alvo.focus();
  },500);
}
/**
 * Junta os campos numa linha só — é o formato que o motor, o PDF e o
 * cadastro usam. Ex: "Rua Exemplo, 120, fundos - Centro".
 */
function montarEndereco(c){
  const ruaNum=[c.rua,c.numero].filter(Boolean).join(', ');
  const comComp=[ruaNum,c.complemento].filter(Boolean).join(', ');
  return [comComp,c.bairro].filter(Boolean).join(' - ');
}

/**
 * Endereço serve pra entregar: precisa de rua e número.
 * "S/N" e "sem número" valem — endereço rural existe e não pode travar
 * o orçamento por causa de uma regra que exige dígito.
 */
function enderecoValido(v){
  const t=String(v||'').trim();
  if(t.length<8)return false;
  return /\d/.test(t)||/\bs\/?\s?n(º|o|\b)/i.test(t)||/sem\s+n[úu]mero/i.test(t);
}

/** CPF ou CNPJ com dígito verificador conferido — evita documento inventado. */
function documentoValido(v){
  const d=String(v||'').replace(/\D/g,'');
  if(d.length===11){
    if(/^(\d)\1{10}$/.test(d))return false;
    const dig=(base,peso)=>{
      let s=0;for(let i=0;i<base;i++)s+=+d[i]*(peso-i);
      const r=(s*10)%11;return r===10?0:r;
    };
    return dig(9,10)===+d[9]&&dig(10,11)===+d[10];
  }
  if(d.length===14){
    if(/^(\d)\1{13}$/.test(d))return false;
    const dig=(base)=>{
      let p=base-7,s=0;
      for(let i=base-1;i>=0;i--){s+=+d[i]*p;p=(--p<2)?9:p;}
      const r=s%11;return r<2?0:11-r;
    };
    return dig(12)===+d[12]&&dig(13)===+d[13];
  }
  return false;
}

function okDados(){
  cliente.nome=g('dn').value.trim();
  cliente.documento=g('dd').value.trim();
  cliente.telefone=g('dt').value.trim();
  cliente.email=g('dm').value.trim();
  cliente.cep=g('dp').value.trim();
  cliente.rua=g('dr').value.trim();
  cliente.numero=g('dnum').value.trim();
  cliente.bairro=g('db').value.trim();
  cliente.complemento=g('dcp').value.trim();
  cliente.cidade=g('dc').value.trim();
  cliente.estado=g('du').value.trim().toUpperCase();
  // linha única para o motor, o PDF e a nota
  cliente.endereco=montarEndereco(cliente);

  // aponta o campo que falhou, em vez de só mostrar a mensagem no rodapé
  const falha=(id,msg)=>{const c=g(id);if(c){c.focus();c.scrollIntoView({block:'center',behavior:'smooth'});}return err(msg);};

  if(cliente.nome.length<2)return falha('dn','Informe seu nome.');
  if(!documentoValido(cliente.documento))
    return falha('dd','Informe um CPF ou CNPJ válido — é o que vai no orçamento e na nota.');
  if(cliente.telefone.replace(/\D/g,'').length<10)return falha('dt','Informe um WhatsApp válido com DDD.');
  if(cliente.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cliente.email))return falha('dm','Esse e-mail não parece válido.');
  if(cliente.cep.replace(/\D/g,'').length!==8)
    return falha('dp','Informe o CEP da obra — é ele que define a unidade de entrega.');
  // CEP de cidade pequena não traz rua nem bairro — por isso os campos são
  // sempre editáveis, e sempre exigidos.
  if(cliente.rua.length<3)return falha('dr','Informe a rua.');
  if(!cliente.numero)return falha('dnum','Informe o número. Se não tiver, escreva S/N.');
  if(cliente.bairro.length<2)return falha('db','Informe o bairro.');
  if(cliente.cidade.length<2)return falha('dc','Informe a cidade.');
  if(!/^[A-Za-zÀ-ÿ]{2}$/.test(cliente.estado))return falha('du','Informe o estado com 2 letras, ex: SP.');

  try{localStorage.setItem('cliente4a',JSON.stringify(cliente));}catch(e){}
  gerar();
}

async function gerar(){
  ocupado(true,'Montando seu orçamento...');
  // Vale o que o cliente conferiu na tela — não a composição original.
  // Se ele não mexeu em nada, a conta dá exatamente o mesmo valor.
  const corpo={modo:'itens',
    itens:(R.linhas||[]).filter(l=>+l.qtd>0)
      .map(l=>({id:l.id,tipo:l.tipo,qtd:+l.qtd,comp:+l.comp||null})),
    ambiente:R.ambiente||null};
  const d=await fetch('/api/orcamento',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pedido:corpo,cliente,vendedorSlug:VSLUG,
      vendedor:new URLSearchParams(location.search).get('vendedor')||null})})
    .then(r=>r.json()).catch(()=>({error:'Falha ao gerar — tente de novo.'}));
  ocupado(false);
  if(d.error)return err(d.error);
  window._res=d;
  ir(passoConferir()+2);
}

try{const s=localStorage.getItem('cliente4a');if(s)Object.assign(cliente,JSON.parse(s));}catch(e){}

fetch('/api/catalogo'+(VSLUG?'?v='+encodeURIComponent(VSLUG):'')).then(r=>r.json()).then(c=>{

    if(_de3d.modo==='auto'){

      A.quedas=_de3d.quedas;A.querAcabamento=_de3d.querAcabamento;A.querEstrutura=_de3d.querEstrutura;

    passo=passoConferir();                     // confere a lista antes dos dados
    hist.push(0);
  }
  render();
}).catch(()=>{T.innerHTML='<h1>Ops!</h1><p class="sub">Não consegui carregar o catálogo.</p>';});
